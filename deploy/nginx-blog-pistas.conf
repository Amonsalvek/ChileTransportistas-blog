# =====================================================
# BLOG.CHILETRANSPORTISTAS.COM
# Nginx: HTML estático + SSI + Blog API + CMS API
#
# Archivo activo:
#   /etc/nginx/sites-available/blog.chiletransportistas.com
# Habilitado con symlink en sites-enabled/
#
# Aplicar:
#   sudo nginx -t && sudo systemctl reload nginx
#
# NO dejar respaldos dentro de sites-enabled/: nginx los carga como una
# configuración más y provoca conflicting server name. Guárdalos en
# sites-available/blog.chiletransportistas.com.backup
# =====================================================

# =====================================================
# HTTP → HTTPS
# =====================================================
server {
    listen 80;
    server_name blog.chiletransportistas.com;

    return 301 https://$host$request_uri;
}

# =====================================================
# HTTPS PRINCIPAL
# =====================================================
server {
    listen 443 ssl;
    server_name blog.chiletransportistas.com;

    root /var/www/blog;
    index blog.html index.html;

    # ------------------------------------
    # Logs
    # ------------------------------------
    access_log /var/log/nginx/blog_access.log;
    error_log  /var/log/nginx/blog_error.log;

    # ------------------------------------
    # SSL (Let's Encrypt)
    # ------------------------------------
    ssl_certificate     /etc/letsencrypt/live/blog.chiletransportistas.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/blog.chiletransportistas.com/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # ------------------------------------
    # HSTS
    # ------------------------------------
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # ------------------------------------
    # SSI
    # El sitio arma navbar, footer, CTAs y migas de pan con includes de
    # servidor. Las migas además usan #set y #echo, así que el módulo tiene
    # que estar activo en todo el HTML.
    # ------------------------------------
    ssi on;
    ssi_types text/html;

    # =====================================================
    # LET'S ENCRYPT
    # Va ANTES de los bloqueos: la ruta empieza por punto y si no, la
    # regla que tapa los dotfiles se la comería y las renovaciones
    # fallarían. Un prefijo ^~ gana a cualquier regex.
    # =====================================================
    location ^~ /.well-known/acme-challenge/ {
        default_type "text/plain";
        root /var/www/letsencrypt;
        ssi off;
    }

    # =====================================================
    # BLOG API
    # Node.js → 127.0.0.1:8787
    #
    # POST /api/blog/publish
    # GET  /api/health
    # =====================================================
    location ^~ /api/blog/ {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Generación de imagen + subida a R2 puede tardar
        proxy_connect_timeout 10s;
        proxy_send_timeout    180s;
        proxy_read_timeout    180s;

        client_max_body_size 10m;
        proxy_buffering off;

        # API no utiliza SSI
        ssi off;
    }

    # =====================================================
    # CMS API
    # Node.js → 127.0.0.1:8788
    #
    # /api/cms/*
    #
    # NO agregar una location genérica "^~ /api/" hacia el 8787: se traga
    # /api/cms/ y lo manda al servicio equivocado.
    # =====================================================
    location ^~ /api/cms/ {
        proxy_pass http://127.0.0.1:8788;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # El CMS manda Origin: null cuando se abre como archivo local.
        proxy_set_header Origin            $http_origin;

        # Publicar genera la portada con OpenAI: puede tardar cerca de un
        # minuto. Cloudflare corta a los 100 s en el plan free.
        proxy_connect_timeout 10s;
        proxy_send_timeout    180s;
        proxy_read_timeout    180s;

        client_max_body_size 10m;
        proxy_buffering off;

        # Las respuestas son JSON: nginx no debe procesarlas como includes.
        ssi off;
    }

    # =====================================================
    # BLOQUEOS
    # /var/www/blog es a la vez el repositorio y la raíz web: todo lo que
    # se commitea queda servido públicamente. Lo que sigue tapa lo que
    # nunca debió ser una URL.
    # =====================================================

    # Cualquier cosa que empiece por punto en cualquier nivel:
    # .git/ (el repositorio entero, clonable con git-dumper), .env,
    # .gitignore, .DS_Store.
    location ~ /\. {
        return 404;
    }

    # Documentación y scripts de despliegue.
    location ^~ /deploy/ {
        return 404;
    }

    # El CMS, si alguna vez se versiona: es una interfaz de administración
    # y el código del servicio del droplet. No se sirve.
    location ^~ "/Chtr Blogs CMS/" {
        return 404;
    }

    # Código fuente y configuración por extensión.
    location ~* \.(?:py|sh|md|conf|service|example|bak|backup|log|sql)$ {
        return 404;
    }

    # =====================================================
    # URLS DUPLICADAS
    # =====================================================

    # La portada se sirve en la raíz; /blog.html era una segunda URL con
    # el mismo contenido.
    location = /blog.html {
        return 301 https://blog.chiletransportistas.com/;
    }

    # El índice de cada pista vive en su directorio, no en index.html.
    location ~ ^/(articulos|transportistas|contratar-transporte)/index(?:\.html)?/?$ {
        return 301 /$1/;
    }

    # Las plantillas no son artículos.
    location ~ ^/(?:articulos|transportistas|contratar-transporte)/base-blog(?:\.html)?/?$ {
        return 404;
    }

    # =====================================================
    # PARCIALES SSI
    # Son fragmentos, no páginas: sin <html>, sin <title>, sin canonical.
    # Servidos por URL propia, Google los indexa como páginas delgadas.
    #
    # "internal" los deja fuera del alcance externo pero permite que el
    # módulo SSI los siga insertando, porque un include es una subpetición
    # y las subpeticiones son internas.
    #
    # Si algo saliera mal, comenta el bloque completo y recarga: el sitio
    # vuelve al comportamiento anterior.
    # =====================================================
    location ~ ^/(?:navbar|footer|breadcrumbs|content-cta|content-cta-carga|right-banner-cta|right-banner-cta-carga|sticky-mobile-cta|sticky-mobile-cta-carga|bottom-banner-blog)(?:\.html)?$ {
        internal;
    }

    # =====================================================
    # ARTÍCULOS DE LAS TRES PISTAS
    #
    #   /articulos/            legado, se migra a /transportistas/ después
    #   /transportistas/       tiene camiones, busca carga
    #   /contratar-transporte/ necesita mover carga
    #
    # OJO: antes esto usaba "location ^~ /articulos/" junto a locations
    # regex para el mismo prefijo. Un prefijo ^~ gana a las regex y las
    # deja muertas, así que las dos reglas de 301 nunca se ejecutaban y
    # /articulos/slug.html seguía respondiendo 200 en paralelo a
    # /articulos/slug/. Ahora las tres reglas son regex y se evalúan en
    # orden.
    # =====================================================

    # .html → URL canónica con barra
    location ~ ^/(articulos|transportistas|contratar-transporte)/(.+)\.html$ {
        return 301 /$1/$2/;
    }

    # sin barra final → con barra
    location ~ ^/(articulos|transportistas|contratar-transporte)/([^/]+)$ {
        return 301 /$1/$2/;
    }

    # Servir el artículo desde su archivo .html
    location ~ ^/(articulos|transportistas|contratar-transporte)/(.+)/$ {
        try_files /$1/$2.html =404;
    }

    # =====================================================
    # ARCHIVOS ESTÁTICOS
    # add_header no se hereda en una location que define los suyos, así
    # que el HSTS se repite aquí.
    # =====================================================
    location ~* \.(?:css|js|jpg|jpeg|gif|png|ico|webp|svg|woff2?)$ {
        expires 30d;
        access_log off;
        add_header Cache-Control "public";
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    }

    # =====================================================
    # RESTO DEL SITIO
    # Portada (/ → blog.html) y hubs (/transportistas/ → su index.html).
    # =====================================================
    location / {
        try_files $uri $uri.html $uri/ =404;
    }

    # =====================================================
    # GZIP
    # =====================================================
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;

    gzip_types
        text/plain
        text/css
        application/javascript
        application/json
        image/svg+xml;
}

