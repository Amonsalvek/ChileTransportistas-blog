# ---------------------------------------------------------------------------
# blog.chiletransportistas.com — routing de las dos pistas del blog
#
#   /transportistas/        quien tiene camiones y busca carga
#   /contratar-transporte/  quien necesita mover carga
#   /articulos/             legado: se migra a /transportistas/ más adelante
#
# Va DENTRO del server block de blog.chiletransportistas.com, en
#   /etc/nginx/sites-available/blog.chiletransportistas.com
#
# Aplicar:
#   sudo nginx -t && sudo systemctl reload nginx
#
# Ojo con el orden: las locations con ^~ ganan a las regex. Las de /api/
# (ver nginx-chtr-cms.conf) tienen que seguir declaradas y no las toca nada
# de este archivo.
# ---------------------------------------------------------------------------

# --- 1. SSI: sin esto no hay navbar, footer, CTAs ni migas de pan ----------
# Las migas de pan usan #set y #echo además de #include, así que el módulo
# SSI tiene que estar activo en todo el HTML del sitio.
ssi          on;
ssi_types    text/html;
ssi_silent_errors off;   # en producción puedes ponerlo en on

# La portada del blog es blog.html.
index blog.html index.html;

# --- 2. URLs con barra final, sin .html -----------------------------------
# Los canonical dicen /articulos/slug/ y /transportistas/slug/. El disco
# tiene articulos/slug.html y transportistas/slug.html.
location / {
    try_files $uri $uri/ $uri.html $uri/index.html =404;
}

# Un slug servido con .html es una URL duplicada: se redirige a la limpia.
location ~ ^/(articulos|transportistas|contratar-transporte)/(.+)\.html$ {
    return 301 https://blog.chiletransportistas.com/$1/$2/;
}

# blog.html sirviéndose por su nombre también duplica la portada.
location = /blog.html {
    return 301 https://blog.chiletransportistas.com/;
}


