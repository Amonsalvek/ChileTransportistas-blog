# =====================================================
# BLOG CHILETRANSPORTISTAS — subdominio retirado (oct 2026)
#
# Los artículos ya no los sirve este droplet: viven en Unicorn como páginas
# dinámicas alimentadas por el Sheet "CMS artículos":
#
#   www.chiletransportistas.com/articulos/                 hub
#   www.chiletransportistas.com/transportistas/{slug}/     tiene camiones, busca carga
#   www.chiletransportistas.com/contratar-transporte/{slug}/  necesita mover carga
#
# blog.chiletransportistas.com queda SOLO para:
#   - 301 de las URLs viejas a su equivalente en www (señales para Google)
#   - /api/blog/ y /api/cms/ (CMS antiguo; se retiran en una segunda etapa)
#   - renovación del certificado (Let's Encrypt)
#
# Archivo activo: /etc/nginx/sites-available/blog.chiletransportistas.com
# (symlink en sites-enabled/). Se aplica con:
#   sudo bash /var/www/blog/deploy/aplicar-nginx.sh
# Configuración anterior (Worker + SSI): en el historial de git de este archivo.
# =====================================================

# -----------------------------------------------------
# Adónde va cada URL vieja en www. "" = se atiende aquí (no redirigir).
# Las regex se evalúan en orden: lo específico va primero.
# -----------------------------------------------------
map $uri $chtr_destino {
    default                             /articulos/;

    ~^/\.well-known/acme-challenge/     "";
    ~^/api/(?:blog|cms)/                "";

    # Artículos: /articulos/x (legado), /transportistas/x, con o sin .html
    ~^/(?:articulos|transportistas)/(?!(?:index|base-blog)(?:\.html)?/?$)(?<chtr_slug_t>[a-z0-9-]+)(?:\.html)?/?$       /transportistas/$chtr_slug_t/;
    ~^/contratar-transporte/(?!(?:index|base-blog)(?:\.html)?/?$)(?<chtr_slug_c>[a-z0-9-]+)(?:\.html)?/?$               /contratar-transporte/$chtr_slug_c/;

    /robots.txt                         /robots.txt;
    /favicon.ico                        /favicon.ico;
    /sitemap-blog.xml                   /sitemap.xml;
}

# =====================================================
# HTTP → HTTPS
# =====================================================
server {
    listen 80;
    server_name blog.chiletransportistas.com;

    return 301 https://$host$request_uri;
}

# =====================================================
# HTTPS
# =====================================================
server {
    listen 443 ssl;
    server_name blog.chiletransportistas.com;

    access_log /var/log/nginx/blog_access.log;
    error_log  /var/log/nginx/blog_error.log;

    ssl_certificate     /etc/letsencrypt/live/blog.chiletransportistas.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/blog.chiletransportistas.com/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Todo lo que no sea API ni certificado: 301 a www (conserva el query string).
    if ($chtr_destino) {
        return 301 https://www.chiletransportistas.com$chtr_destino$is_args$args;
    }

    location ^~ /.well-known/acme-challenge/ {
        default_type "text/plain";
        root /var/www/letsencrypt;
    }

    # APIs del CMS antiguo. NO agregar una location genérica "^~ /api/": se traga /api/cms/.
    location ^~ /api/blog/ {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_send_timeout    180s;
        proxy_read_timeout    180s;
        client_max_body_size 10m;
        proxy_buffering off;
    }

    location ^~ /api/cms/ {
        proxy_pass http://127.0.0.1:8788;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Origin            $http_origin;
        proxy_connect_timeout 10s;
        proxy_send_timeout    180s;
        proxy_read_timeout    180s;
        client_max_body_size 10m;
        proxy_buffering off;
    }

    location / {
        return 404;
    }
}
