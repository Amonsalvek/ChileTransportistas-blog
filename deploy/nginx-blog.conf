# =====================================================
# BLOG CHILETRANSPORTISTAS — origen del droplet
#
# El blog se publica en www.chiletransportistas.com:
#
#   /blog/                     portada del blog (reemplaza la de Unicorn)
#   /blog/assets/...           CSS y JS propios del blog
#   /transportistas/...        pista de quien tiene camiones y busca carga
#   /contratar-transporte/...  pista de quien necesita mover carga
#   /sitemap-blog.xml
#
# www apunta a Unicorn. Un Worker de Cloudflare (worker/src/index.js) toma
# esas rutas y las pide a ESTE servidor usando blog.chiletransportistas.com
# como hostname de origen, con la cabecera "X-Chtr-Proxy: worker". El
# subdominio sigue existiendo solo como origen: una visita directa (sin la
# cabecera) recibe un 301 a la URL equivalente en www.
#
# Archivo activo:
#   /etc/nginx/sites-available/blog.chiletransportistas.com
# Habilitado con symlink en sites-enabled/. Lo instala
# deploy/migrar-a-www.sh; a mano sería:
#   sudo cp deploy/nginx-blog.conf /etc/nginx/sites-available/blog.chiletransportistas.com
#   sudo nginx -t && sudo systemctl reload nginx
#
# NO dejar respaldos dentro de sites-enabled/: nginx los carga como una
# configuración más y provoca conflicting server name.
#
# NO activar "Cache Everything" para blog.chiletransportistas.com en
# Cloudflare: la misma URL responde 301 a las visitas y 200 al Worker, y la
# caché no distingue la cabecera. Con la caché por defecto (solo estáticos
# por extensión) no hay problema.
# =====================================================

# -----------------------------------------------------
# ¿La petición viene del Worker?
# Suplantar la cabecera no da nada: se ve la misma página, con canonical a
# www. No es un control de acceso, es un enrutador.
# -----------------------------------------------------
map $http_x_chtr_proxy $chtr_via_worker {
    default 0;
    worker  1;
}

# -----------------------------------------------------
# Visitas directas al subdominio: adónde va cada URL vieja en www.
# "" significa "no redirigir, se atiende aquí".
# Las regex se evalúan en orden: lo específico va primero.
# -----------------------------------------------------
map $uri $chtr_destino_publico {
    default                     /blog/;

    # Sigue viviendo en el subdominio
    ~^/\.well-known/acme-challenge/   "";
    ~^/api/(?:blog|cms)/              "";
    # Los estáticos se sirven en los dos hosts: así una visita directa nunca
    # deja un 301 en la caché de Cloudflare con la clave que usa el Worker.
    ~^/blog/assets/                   "";

    /                           /blog/;
    /blog.html                  /blog/;
    /sitemap-blog.xml           /sitemap-blog.xml;
    /robots.txt                 /robots.txt;
    /favicon.ico                /favicon.ico;

    # Legado: todo /articulos/ se movió a /transportistas/
    ~^/articulos/?$                                              /transportistas/;
    ~^/articulos/(?<chtr_slug_a>[a-z0-9-]+)(?:\.html)?/?$        /transportistas/$chtr_slug_a/;

    # Pistas: mismo camino, ya normalizado
    ~^/(?<chtr_pista_h>transportistas|contratar-transporte)(?:/(?:index(?:\.html)?)?)?$           /$chtr_pista_h/;
    ~^/(?<chtr_pista_a>transportistas|contratar-transporte)/(?<chtr_slug_p>[a-z0-9-]+)(?:\.html)?/?$   /$chtr_pista_a/$chtr_slug_p/;

    # Estáticos con la ruta vieja
    ~^/assets/(?<chtr_asset>.+)$      /blog/assets/$chtr_asset;
}

map $chtr_via_worker $chtr_redirigir_a {
    1       "";
    default $chtr_destino_publico;
}

# =====================================================
# HTTP → HTTPS
# =====================================================
server {
    listen 80;
    server_name blog.chiletransportistas.com;

    return 301 https://$host$request_uri;
}

# =====================================================
# HTTPS
# =====================================================
server {
    listen 443 ssl;
    server_name blog.chiletransportistas.com;

    root /var/www/blog;

    # Los 301 internos (/transportistas → /transportistas/, x.html → x/)
    # salen relativos. Si fueran absolutos llevarían el host del
    # subdominio, y el navegador que llegó por www saltaría al subdominio
    # para rebotar de vuelta.
    absolute_redirect off;

    access_log /var/log/nginx/blog_access.log;
    error_log  /var/log/nginx/blog_error.log;

    # ------------------------------------
    # SSL (Let's Encrypt)
    # ------------------------------------
    ssl_certificate     /etc/letsencrypt/live/blog.chiletransportistas.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/blog.chiletransportistas.com/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # ------------------------------------
    # SSI: navbar, footer, CTAs y migas de pan se arman con includes.
    # (ssi_types ya trae text/html: repetirlo da "duplicate MIME type").
    # ------------------------------------
    ssi on;

    # =====================================================
    # PUERTA: visita directa al subdominio → 301 a www.
    # Corre antes de elegir location. Las subpeticiones SSI heredan las
    # cabeceras y las variables de la petición del Worker, así que los
    # includes no rebotan.
    # =====================================================
    if ($chtr_redirigir_a) {
        return 301 https://www.chiletransportistas.com$chtr_redirigir_a$is_args$args;
    }

    # =====================================================
    # LET'S ENCRYPT (renovación del certificado del subdominio)
    # =====================================================
    location ^~ /.well-known/acme-challenge/ {
        default_type "text/plain";
        root /var/www/letsencrypt;
        ssi off;
    }

    # =====================================================
    # APIs del CMS (siguen en el subdominio: no son páginas)
    #   /api/blog/  → chtr-blog-api → 127.0.0.1:8787
    #   /api/cms/   → chtr-cms-api  → 127.0.0.1:8788
    # NO agregar una location genérica "^~ /api/": se traga /api/cms/.
    # =====================================================
    location ^~ /api/blog/ {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_send_timeout    180s;
        proxy_read_timeout    180s;
        client_max_body_size 10m;
        proxy_buffering off;
        ssi off;
    }

    location ^~ /api/cms/ {
        proxy_pass http://127.0.0.1:8788;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Origin            $http_origin;
        proxy_connect_timeout 10s;
        proxy_send_timeout    180s;
        proxy_read_timeout    180s;
        client_max_body_size 10m;
        proxy_buffering off;
        ssi off;
    }

    # =====================================================
    # PORTADA DEL BLOG: www.chiletransportistas.com/blog/
    #
    # try_files y no "index": index hace una redirección interna que vuelve
    # a pasar por las locations, y con los 301 de abajo eso ciclaba.
    # =====================================================
    location = /blog {
        return 301 /blog/;
    }

    location = /blog/ {
        try_files /blog/index.html =404;
    }

    location ~ ^/blog/index(?:\.html)?/?$ {
        return 301 /blog/;
    }

    location ^~ /blog/assets/ {
        ssi off;
        expires 30d;
        access_log off;
        add_header Cache-Control "public";
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        try_files $uri =404;
    }

    # =====================================================
    # PISTAS
    #   /transportistas/        tiene camiones, busca carga
    #   /contratar-transporte/  necesita mover carga
    # Las regex se evalúan en orden.
    # =====================================================

    # Las plantillas no son artículos.
    location ~ ^/(?:transportistas|contratar-transporte)/base-blog(?:\.html)?/?$ {
        return 404;
    }

    # El índice de cada pista vive en su directorio.
    location ~ ^/(transportistas|contratar-transporte)/index(?:\.html)?/?$ {
        return 301 /$1/;
    }

    # Pista sin barra final.
    location ~ ^/(transportistas|contratar-transporte)$ {
        return 301 /$1/;
    }

    # Hub.
    location ~ ^/(transportistas|contratar-transporte)/$ {
        try_files /$1/index.html =404;
    }

    # .html → URL canónica con barra.
    location ~ ^/(transportistas|contratar-transporte)/([a-z0-9-]+)\.html$ {
        return 301 /$1/$2/;
    }

    # Sin barra final → con barra.
    location ~ ^/(transportistas|contratar-transporte)/([a-z0-9-]+)$ {
        return 301 /$1/$2/;
    }

    # Artículo.
    location ~ ^/(transportistas|contratar-transporte)/([a-z0-9-]+)/$ {
        try_files /$1/$2.html =404;
    }

    # =====================================================
    # SITEMAP (lo regenera update_sitemap_blog.py)
    # =====================================================
    location = /sitemap-blog.xml {
        ssi off;
        try_files $uri =404;
    }

    # =====================================================
    # PARCIALES SSI: fragmentos, no páginas. "internal" deja que el módulo
    # SSI los inserte (un include es una subpetición interna) pero los
    # esconde de fuera.
    # =====================================================
    location ~ ^/(?:navbar|footer|breadcrumbs|content-cta|content-cta-carga|right-banner-cta|right-banner-cta-carga|sticky-mobile-cta|sticky-mobile-cta-carga|bottom-banner-blog)\.html$ {
        internal;
    }

    # =====================================================
    # TODO LO DEMÁS NO EXISTE
    # /var/www/blog es a la vez el repositorio y la raíz web: .git/,
    # deploy/, scripts/, worker/, .claude/, "Chtr Blogs CMS/"… Con una lista
    # blanca en vez de una lista negra, nada de eso puede quedar expuesto
    # por olvido. Un 404 aquí hace que el Worker pruebe en Unicorn.
    # =====================================================
    location / {
        return 404;
    }

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_types
        text/plain
        text/css
        text/xml
        application/xml
        application/javascript
        application/json
        image/svg+xml;
}
