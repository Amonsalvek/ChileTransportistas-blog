# ---------------------------------------------------------------------------
# Server block de blog.chiletransportistas.com
#
# Nginx es el único punto de entrada público. Los dos servicios Node escuchan
# solo en localhost y se exponen por su propio prefijo:
#
#   /api/blog/  ->  chtr-blog-api  ->  127.0.0.1:8787   (publicación)
#   /api/cms/   ->  chtr-cms-api   ->  127.0.0.1:8788   (CMS y pull requests)
#
# Archivo activo:
#   /etc/nginx/sites-available/blog.chiletransportistas.com
# Habilitado con un symlink en:
#   /etc/nginx/sites-enabled/blog.chiletransportistas.com
#
# Aplicar:
#   sudo nano /etc/nginx/sites-available/blog.chiletransportistas.com
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo nginx -T 2>&1 | grep -n -E "location .*api|proxy_pass.*878"
#
# NO agregar una location genérica "^~ /api/" hacia el 8787: se traga /api/cms/
# y lo manda al servicio equivocado.
#
# NO dejar respaldos dentro de sites-enabled/: nginx los carga como una
# configuración más y provoca
#   conflicting server name "blog.chiletransportistas.com"
# Guárdalos en sites-available/blog.chiletransportistas.com.backup
# ---------------------------------------------------------------------------

# --- CMS: lectura del repositorio y pull requests --------------------------
location ^~ /api/cms/ {
    proxy_pass         http://127.0.0.1:8788;
    proxy_http_version 1.1;

    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
    # El CMS manda "Origin: null" cuando se abre como archivo local.
    proxy_set_header   Origin            $http_origin;

    # Publicar genera la portada con OpenAI: puede tardar cerca de un minuto.
    # Cloudflare corta a los 100 s en el plan free, así que ese es el techo real.
    proxy_connect_timeout 10s;
    proxy_send_timeout    180s;
    proxy_read_timeout    180s;

    # Los artículos pueden pesar bastante (HTML + índice en el mismo PR).
    client_max_body_size 10m;
    proxy_buffering      off;

    # Las respuestas son JSON: nginx no debe procesarlas como includes del sitio.
    ssi off;
}

# --- Publicación: servicio que ya existía, debe seguir tal cual -------------
location ^~ /api/blog/ {
    proxy_pass         http://127.0.0.1:8787;
    proxy_http_version 1.1;

    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
}
