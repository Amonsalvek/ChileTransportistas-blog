<script>
/* ==============================================================
   15. Pestaña: Contenido (editor visual + HTML)
   ============================================================== */

const SSI_RE_G = /\x3C!--#include\s+(?:file|virtual)\s*=\s*"([^"]+)"\s*-->/g;

function bodyToEditable(body){
  return String(body || '').replace(SSI_RE_G, (all, p) =>
    '<div class="ssi-chip" contenteditable="false" data-ssi="' + escAttr(p) + '">include ' + esc(p) +
    '<span class="x" title="Quitar del artículo"><ion-icon name="close-outline"></ion-icon></span></div>');
}

/* Serializa el editor visual de vuelta a HTML.
   El navegador reescribe el marcado al editar, así que una serialización
   directa cambiaría el formato de TODO el artículo y el pull request
   mostraría cientos de líneas por corregir una palabra. Para evitarlo se
   alinea el resultado con el cuerpo original y los bloques que no cambiaron
   se reutilizan textualmente, con su sangría y sus separadores. */
function editableToBody(root, original){
  const clone = root.cloneNode(true);
  Array.from(clone.querySelectorAll('.ssi-chip')).forEach(el => {
    el.parentNode.replaceChild(document.createComment('#include file="' + el.getAttribute('data-ssi') + '" '), el);
  });
  Array.from(clone.querySelectorAll('[contenteditable]')).forEach(el => el.removeAttribute('contenteditable'));

  const nuevos = topLevelBlocks(clone);
  if(!original) return nuevos.map(b => b.fmt).join('\n\n');

  const viejos = splitBody(original);
  const ops = seqDiff(viejos.map(b => b.norm), nuevos.map(b => b.norm));
  const piezas = [];
  /* Un bloque reemplazado hereda la separación y la sangría del que sustituye,
     para que el cambio se vea donde estaba y no mueva el resto del archivo. */
  let leadHuerfano = null;
  ops.forEach(op => {
    if(op.t === 'd'){ if(leadHuerfano === null) leadHuerfano = viejos[op.i].lead; return; }
    if(op.t === '='){ piezas.push({ text: viejos[op.i].src, lead: viejos[op.i].lead }); leadHuerfano = null; return; }
    if(leadHuerfano !== null){ piezas.push({ text: nuevos[op.j].bare, lead: leadHuerfano }); leadHuerfano = null; }
    else piezas.push({ text: nuevos[op.j].fmt, lead: null });
  });
  let out = '';
  piezas.forEach((pz, i) => {
    out += (pz.lead != null ? pz.lead : (i === 0 ? '' : '\n\n')) + pz.text;
  });
  return out;
}

/** Normaliza un bloque para comparar contenido ignorando el formato. */
function normBlock(h){
  return String(h == null ? '' : h)
    .replace(/\x3C!--#include\s+(?:file|virtual)\s*=\s*"([^"]+)"\s*-->/g, '@SSI:$1@')
    .replace(/\s+/g, ' ')
    .replace(/>\s+/g, '>').replace(/\s+\x3C/g, '\x3C')
    .trim();
}

const VOID_TAGS = /^(?:area|base|br|col|embed|hr|img|input|link|meta|param|source|track|wbr)$/i;

/** Final de una etiqueta de apertura, respetando comillas. */
function findTagEnd(s, at){
  let i = at + 1, q = null;
  while(i < s.length){
    const c = s[i];
    if(q){ if(c === q) q = null; }
    else if(c === '"' || c === "'") q = c;
    else if(c === '>') return i + 1;
    i++;
  }
  return -1;
}
/** Final del elemento que abre en `from`, contando anidamiento del mismo tag. */
function findClose(s, from, tag){
  const open  = new RegExp('\x3C' + reEsc(tag) + '(?=[\\s/>])', 'gi');
  const close = new RegExp('\x3C\\/' + reEsc(tag) + '\\s*>', 'gi');
  let depth = 1, i = from;
  while(i < s.length){
    close.lastIndex = i;
    const c = close.exec(s);
    if(!c) return s.length;
    open.lastIndex = i;
    let o, extra = 0;
    while((o = open.exec(s)) !== null && o.index < c.index) extra++;
    depth += extra - 1;
    i = c.index + c[0].length;
    if(depth <= 0) return i;
  }
  return s.length;
}

/** Nodos de primer nivel del cuerpo original, con el texto exacto que los
    precede (`lead`). Reutilizar ambos es lo que mantiene el diff pequeño:
    los bloques que no se tocaron vuelven al archivo tal cual estaban,
    con su sangría y sus saltos de línea originales. */
function splitBody(body){
  const s = String(body || '');
  const out = [];
  let i = 0, last = 0;
  while(i < s.length){
    const lt = s.indexOf('\x3C', i);
    if(lt < 0) break;
    let end;
    if(s.slice(lt, lt + 4) === '\x3C!--'){
      const e = s.indexOf('-->', lt);
      end = e < 0 ? s.length : e + 3;
    }else{
      const mt = /^\x3C([a-zA-Z][\w:-]*)/.exec(s.slice(lt, lt + 40));
      if(!mt){ i = lt + 1; continue; }
      const tagEnd = findTagEnd(s, lt);
      if(tagEnd < 0){ i = lt + 1; continue; }
      end = (VOID_TAGS.test(mt[1]) || s[tagEnd - 2] === '/') ? tagEnd : findClose(s, tagEnd, mt[1]);
    }
    const lead = s.slice(last, lt);
    if(lead.trim()){
      /* texto suelto entre bloques: es un nodo por derecho propio */
      const t = lead.replace(/^\s+/, '');
      out.push({ src: t, lead: lead.slice(0, lead.length - t.length), norm: normBlock(t) });
      out.push({ src: s.slice(lt, end), lead: '', norm: normBlock(s.slice(lt, end)) });
    }else{
      out.push({ src: s.slice(lt, end), lead: lead, norm: normBlock(s.slice(lt, end)) });
    }
    last = end; i = end;
  }
  const tailTxt = s.slice(last);
  if(tailTxt.trim()){
    const t = tailTxt.replace(/^\s+/, '');
    out.push({ src: t.replace(/\s+$/, ''), lead: tailTxt.slice(0, tailTxt.length - t.length), norm: normBlock(t) });
  }
  return out;
}

/** Bloques de primer nivel del editor, ya formateados. */
function topLevelBlocks(container){
  const out = [];
  Array.from(container.childNodes).forEach(n => {
    let fmt = null;
    if(n.nodeType === 3){ const t = n.textContent.replace(/\s+/g,' ').trim(); if(t) fmt = '  ' + t; }
    else if(n.nodeType === 8) fmt = '  \x3C!--' + n.data + '-->';
    else if(n.nodeType === 1) fmt = indentNode(n, 1);
    if(fmt != null) out.push({ fmt, bare: fmt.replace(/^[ \t]+/, ''), norm: normBlock(fmt) });
  });
  return out;
}

/** Alineación por subsecuencia común más larga entre dos listas. */
function seqDiff(A, B){
  const n = A.length, m = B.length;
  if(n * m > 1000000) return B.map((_, j) => ({t:'a', j}));
  const dp = [];
  for(let i = 0; i <= n; i++) dp.push(new Uint32Array(m + 1));
  for(let i = n - 1; i >= 0; i--)
    for(let j = m - 1; j >= 0; j--)
      dp[i][j] = A[i] === B[j] ? dp[i+1][j+1] + 1 : Math.max(dp[i+1][j], dp[i][j+1]);
  const out = [];
  let i = 0, j = 0;
  while(i < n && j < m){
    if(A[i] === B[j]){ out.push({t:'=', i, j}); i++; j++; }
    else if(dp[i+1][j] >= dp[i][j+1]){ out.push({t:'d', i}); i++; }
    else { out.push({t:'a', j}); j++; }
  }
  while(i < n) out.push({t:'d', i: i++});
  while(j < m) out.push({t:'a', j: j++});
  return out;
}

function attrsOf(el){
  return Array.from(el.attributes).map(a => ' ' + a.name + '="' + escAttr(a.value) + '"').join('');
}
function indentNode(el, depth){
  const pad = '  '.repeat(depth);
  const tag = el.tagName.toLowerCase();
  if(tag === 'ul' || tag === 'ol'){
    const items = Array.from(el.children).map(li => '  '.repeat(depth+1) + li.outerHTML.replace(/\s+/g,' ').trim());
    return pad + '<' + tag + attrsOf(el) + '>\n' + items.join('\n') + '\n' + pad + '</' + tag + '>';
  }
  if(tag === 'figure' || tag === 'blockquote'){
    const inner = Array.from(el.childNodes).map(c => {
      if(c.nodeType === 1) return '  '.repeat(depth+1) + c.outerHTML;
      if(c.nodeType === 8) return '  '.repeat(depth+1) + '\x3C!--' + c.data + '-->';
      const t = String(c.textContent).replace(/\s+/g,' ').trim();
      return t ? '  '.repeat(depth+1) + t : '';
    }).filter(x => x);
    return pad + '<' + tag + attrsOf(el) + '>\n' + inner.join('\n') + '\n' + pad + '</' + tag + '>';
  }
  return pad + el.outerHTML;
}

function syncFromEditor(){
  const e = App.editing; if(!e) return;
  const rte = $('#rte');
  const src = $('#bodySrc');
  /* El editor visual reformatea el HTML al serializar. Si el usuario no
     escribió nada, se deja el cuerpo original intacto para que la edición
     conservadora no genere un diff de todo el artículo. */
  if(e.editorMode === 'visual' && rte){
    if(e.rteTouched) e.m.body = editableToBody(rte, e.baseline ? e.baseline.body : null);
  }
  else if(src) e.m.body = src.value;
}

function tabContenido(box){
  const e = App.editing;
  box.innerHTML =
    '<div class="pane active"><div class="ed-split">' +
      '<div class="ed-col">' +
        '<div class="colhead">' +
          '<span class="lb">Cuerpo del &lt;article&gt;</span>' +
          '<button class="btn sm ' + (e.editorMode==='visual'?'primary':'') + '" data-em="visual">Visual</button>' +
          '<button class="btn sm ' + (e.editorMode==='html'?'primary':'') + '" data-em="html">HTML</button>' +
          '<button class="btn sm ghost" data-ed="togglepv" title="Mostrar u ocultar la vista previa">' + (e.showPreview ? '<ion-icon name="eye-outline"></ion-icon>' : '<ion-icon name="eye-off-outline"></ion-icon>') + '</button>' +
        '</div>' +
        (e.editorMode === 'visual' ? rteToolbar() : '') +
        (e.editorMode === 'visual'
          ? '<div class="rte" id="rte" contenteditable="true" spellcheck="true"></div>'
          : '<div class="codewrap"><textarea id="bodySrc" class="code" spellcheck="false"></textarea></div>') +
      '</div>' +
      (e.showPreview ? '<div class="ed-col"><div class="colhead"><span class="lb">Vista previa</span>' +
        '<button class="btn sm ghost" data-dev="desk"><ion-icon name="desktop-outline"></ion-icon></button><button class="btn sm ghost" data-dev="mob"><ion-icon name="phone-portrait-outline"></ion-icon></button>' +
        '<button class="btn sm ghost" data-ed="refreshpv"><ion-icon name="refresh-outline"></ion-icon></button></div>' +
        '<iframe id="pvFrame" style="flex:1;border:none;width:100%;background:#fff" sandbox="allow-scripts allow-popups"></iframe></div>' : '') +
    '</div></div>';

  if(e.editorMode === 'visual'){
    const rte = $('#rte');
    rte.innerHTML = bodyToEditable(e.m.body);
    rte.addEventListener('input', () => { e.rteTouched = true; markDirty(); schedulePreview(); });
    rte.addEventListener('blur', () => { syncFromEditor(); updateEdHead(); });
    rte.addEventListener('click', ev => {
      const x = ev.target.closest('.ssi-chip .x');
      if(x){ x.parentElement.remove(); e.rteTouched = true; markDirty(); syncFromEditor(); schedulePreview(); }
    });
    rte.addEventListener('keydown', ev => {
      if((ev.metaKey || ev.ctrlKey) && ev.key.toLowerCase() === 'k'){ ev.preventDefault(); cmdLink(); }
      if((ev.metaKey || ev.ctrlKey) && ev.key.toLowerCase() === 's'){ ev.preventDefault(); doSaveLocal(); }
    });
    rte.addEventListener('paste', ev => {
      const html = ev.clipboardData && ev.clipboardData.getData('text/html');
      if(html && /<(p|h[1-6]|ul|ol|table|div)[\s>]/i.test(html)){
        ev.preventDefault();
        const clean = sanitizePaste(html);
        execCmd('insertHTML', clean);
        e.rteTouched = true; markDirty(); schedulePreview();
      }
    });
    $$('.toolbar .tb').forEach(b => b.onclick = ev => { ev.preventDefault(); runCmd(b.dataset.cmd); });
  }else{
    const ta = $('#bodySrc');
    ta.value = e.m.body;
    ta.addEventListener('input', () => { e.m.body = ta.value; markDirty(); schedulePreview(); });
    ta.addEventListener('keydown', ev => {
      if(ev.key === 'Tab'){ ev.preventDefault(); const s = ta.selectionStart; ta.value = ta.value.slice(0,s) + '  ' + ta.value.slice(ta.selectionEnd); ta.selectionStart = ta.selectionEnd = s + 2; }
      if((ev.metaKey || ev.ctrlKey) && ev.key.toLowerCase() === 's'){ ev.preventDefault(); doSaveLocal(); }
    });
  }

  $$('[data-em]').forEach(b => b.onclick = () => { syncFromEditor(); e.editorMode = b.dataset.em; tabContenido(box); });
  $$('[data-dev]').forEach(b => b.onclick = () => { e.device = b.dataset.dev; schedulePreview(true); });
  if(e.showPreview) schedulePreview(true);
}

function rteToolbar(){
  const b = (cmd, label, title) =>
    '<button class="tb" data-cmd="' + cmd + '" title="' + escAttr(title) + '">' + label + '</button>';
  return '<div class="toolbar">' +
    b('p','¶','Párrafo') + b('h2','H2','Subtítulo nivel 2') + b('h3','H3','Subtítulo nivel 3') +
    '<div class="div"></div>' +
    b('bold','<b>B</b>','Negrita (⌘B)') + b('italic','<i>I</i>','Cursiva (⌘I)') + b('link','<ion-icon name="link-outline"></ion-icon>','Enlace (⌘K)') + b('unlink','<ion-icon name="unlink-outline"></ion-icon>','Quitar enlace') +
    '<div class="div"></div>' +
    b('ul','<ion-icon name="list-outline"></ion-icon>','Lista con viñetas') + b('ol','1.','Lista numerada') + b('quote','<ion-icon name="chatbox-outline"></ion-icon>','Cita') +
    '<div class="div"></div>' +
    b('figure','<ion-icon name="image-outline"></ion-icon>','Insertar imagen') + b('linea','<ion-icon name="remove-outline"></ion-icon>','Línea divisoria') + b('table','<ion-icon name="grid-outline"></ion-icon>','Tabla') + b('ssi','<ion-icon name="layers-outline"></ion-icon>','Insertar CTA (include SSI)') +
    '<div class="div"></div>' +
    b('clean','<ion-icon name="brush-outline"></ion-icon>','Limpiar formato') + b('undo','<ion-icon name="arrow-undo-outline"></ion-icon>','Deshacer') + b('redo','<ion-icon name="arrow-redo-outline"></ion-icon>','Rehacer') +
  '</div>';
}

function runCmd(cmd){
  const rte = $('#rte'); if(!rte) return;
  if(App.editing) App.editing.rteTouched = true;
  rte.focus();
  switch(cmd){
    case 'p':  execCmd('formatBlock','<p>'); break;
    case 'h2': execCmd('formatBlock','<h2>'); break;
    case 'h3': execCmd('formatBlock','<h3>'); break;
    case 'bold': execCmd('bold'); break;
    case 'italic': execCmd('italic'); break;
    case 'unlink': execCmd('unlink'); break;
    case 'ul': execCmd('insertUnorderedList'); break;
    case 'ol': execCmd('insertOrderedList'); break;
    case 'quote': execCmd('formatBlock','<blockquote>'); break;
    case 'clean': execCmd('removeFormat'); break;
    case 'undo': execCmd('undo'); break;
    case 'redo': execCmd('redo'); break;
    case 'link': cmdLink(); return;
    case 'figure': cmdFigure(); return;
    case 'linea': execCmd('insertHTML','<div class="linea"></div><p><br></p>'); break;
    case 'table': execCmd('insertHTML',
      '<table><thead><tr><th>Columna</th><th>Columna</th></tr></thead>' +
      '<tbody><tr><td>Dato</td><td>Dato</td></tr><tr><td>Dato</td><td>Dato</td></tr></tbody></table><p><br></p>'); break;
    case 'ssi': cmdSsi(); return;
  }
  markDirty(); syncFromEditor(); schedulePreview();
}

async function cmdLink(){
  if(App.editing) App.editing.rteTouched = true;
  const sel = window.getSelection();
  const text = sel ? String(sel) : '';
  const url = await promptModal({ title:'Insertar enlace', label:'URL', value:'https://',
    hint:'Los enlaces externos del blog usan <code>target="_blank"</code>. Los internos apuntan a <code>https://www.chiletransportistas.com/…</code>' });
  if(!url) return;
  $('#rte').focus();
  const ext = !/chiletransportistas\.com/i.test(url);
  if(text) execCmd('insertHTML', '<a href="' + escAttr(url) + '"' + (ext ? ' target="_blank" rel="nofollow noopener"' : ' target="_blank"') + '>' + escText(text) + '</a>');
  else     execCmd('insertHTML', '<a href="' + escAttr(url) + '"' + (ext ? ' target="_blank" rel="nofollow noopener"' : ' target="_blank"') + '>' + escText(url) + '</a>');
  markDirty(); syncFromEditor(); schedulePreview();
}

async function cmdFigure(){
  if(App.editing) App.editing.rteTouched = true;
  const e = App.editing;
  const suggested = e.m.slug ? imageFor(e.m.slug) : '';
  return new Promise(res => {
    modalResolve = res;
    const m = openModal(
      '<div class="mh"><h3>Insertar imagen</h3></div><div class="mb">' +
      '<div class="field"><label>URL de la imagen</label><input type="url" id="fu" value="' + escAttr(suggested) + '" data-autofocus>' +
      '<div class="hint">La portada de cada artículo vive en el CDN: <code>' + esc(SITE.cdnPattern) + '</code></div></div>' +
      '<div class="field"><label>Texto alternativo (alt)</label><input type="text" id="fa" placeholder="camión rampla en la Ruta 5 al atardecer">' +
      '<div class="hint">Obligatorio: describe la imagen para accesibilidad y buscadores.</div></div>' +
      '<div class="field"><label>Pie de foto (opcional)</label><input type="text" id="fc"></div>' +
      '</div><div class="mf"><button class="btn" data-x="c">Cancelar</button><button class="btn primary" data-x="o">Insertar</button></div>');
    m.querySelector('[data-x=c]').onclick = () => closeModal(null);
    m.querySelector('[data-x=o]').onclick = () => {
      const u = m.querySelector('#fu').value.trim(), a = m.querySelector('#fa').value.trim(), c = m.querySelector('#fc').value.trim();
      closeModal(null);
      if(!u) return;
      $('#rte').focus();
      execCmd('insertHTML',
        '<figure><img loading="lazy" src="' + escAttr(u) + '" alt="' + escAttr(a) + '">' +
        (c ? '<figcaption>' + escText(c) + '</figcaption>' : '') + '</figure><p><br></p>');
      markDirty(); syncFromEditor(); schedulePreview();
    };
  });
}

async function cmdSsi(){
  if(App.editing) App.editing.rteTouched = true;
  const opts = SITE.includeFiles.map(p => '<option value="' + escAttr(p) + '">' + esc(p) + '</option>').join('');
  return new Promise(res => {
    modalResolve = res;
    const m = openModal(
      '<div class="mh"><h3>Insertar include SSI</h3></div><div class="mb">' +
      '<div class="field"><label>Componente del sitio</label><select id="si">' + opts + '</select>' +
      '<div class="hint">Se inserta como <code>&lt;!--#include file="…" --&gt;</code>. El servidor lo reemplaza al servir la página; en el editor se ve como un bloque bloqueado.</div></div>' +
      '</div><div class="mf"><button class="btn" data-x="c">Cancelar</button><button class="btn primary" data-x="o">Insertar</button></div>');
    m.querySelector('[data-x=c]').onclick = () => closeModal(null);
    m.querySelector('[data-x=o]').onclick = () => {
      const p = m.querySelector('#si').value; closeModal(null);
      $('#rte').focus();
      execCmd('insertHTML',
        '<div class="ssi-chip" contenteditable="false" data-ssi="' + escAttr(p) + '">include ' + esc(p) + '<span class="x"><ion-icon name="close-outline"></ion-icon></span></div><p><br></p>');
      markDirty(); syncFromEditor(); schedulePreview();
    };
  });
}

function sanitizePaste(html){
  const d = document.createElement('div');
  d.innerHTML = html;
  d.querySelectorAll('script,style,meta,link,noscript').forEach(n => n.remove());
  d.querySelectorAll('*').forEach(el => {
    Array.from(el.attributes).forEach(a => {
      const n = a.name.toLowerCase();
      const keep = (n === 'href' || n === 'src' || n === 'alt' || n === 'target' || n === 'rel' || n === 'loading' ||
                    (n === 'class' && /^(linea|container|subtitle|data-table|note-box|chart-container)$/.test(a.value)));
      if(!keep) el.removeAttribute(a.name);
    });
  });
  return d.innerHTML;
}

/* ---- vista previa ---- */
const schedulePreview = debounce(function(force){
  const e = App.editing; if(!e) return;
  const fr = $('#pvFrame') || $('#pvFrameBig');
  if(!fr) return;
  syncFromEditor();
  fr.srcdoc = previewDoc(currentHtml());
  if(e.device === 'mob'){ fr.style.maxWidth = '400px'; fr.style.margin = '0 auto'; fr.style.borderLeft = '1px solid #e3e8ee'; fr.style.borderRight = '1px solid #e3e8ee'; }
  else { fr.style.maxWidth = ''; fr.style.margin = ''; fr.style.borderLeft = 'none'; fr.style.borderRight = 'none'; }
}, 420);

function previewDoc(html){
  let out = String(html || '');
  out = out.replace(SSI_RE_G, (all, p) => {
    if(App.includes[p]) return '\n\x3C!-- SSI ' + p + ' -->\n' + App.includes[p] + '\n\x3C!-- /SSI -->\n';
    return '<div style="margin:14px auto;max-width:1000px;padding:10px 14px;border:1px dashed #b9c4d0;border-radius:8px;' +
           'background:repeating-linear-gradient(45deg,#f4f7fa,#f4f7fa 8px,#eef2f6 8px,#eef2f6 16px);' +
           'font:600 12px/1.4 ui-monospace,monospace;color:#4a5560">SSI · ' + esc(p) +
           ' <span style="opacity:.65;font-weight:400">(conecta la carpeta local o la API para verlo resuelto)</span></div>';
  });
  out = out.replace('<link rel="stylesheet" href="/assets/css/styles.css">', '<style>' + SITE_CSS + '</style>');
  out = out.replace(/\x3Cscript[^>]*analytics\.ahrefs\.com[^>]*>\x3C\/script>/gi, '');
  out = out.replace('</head>', '<base target="_blank"><link rel="preconnect" href="https://fonts.googleapis.com">' +
    '<link href="https://fonts.googleapis.com/css2?family=Exo:wght@400;600;700&family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet"></head>');
  return out;
}
</script>
<script>
/* ==============================================================
   16. Pestañas: metadatos, portada, índice, revisión, documento, previa
   ============================================================== */

function bindField(id, get, set){
  const el = $('#' + id); if(!el) return;
  el.value = get() == null ? '' : get();
  el.addEventListener('input', () => { set(el.value); markDirty(); updateEdHead(); });
}
function counter(id, val, min, max){
  const n = String(val || '').length;
  const cls = n === 0 ? 'mute' : (n < min || n > max) ? 'warn' : 'ok';
  return '<span class="chip ' + cls + '" id="' + id + '">' + n + '</span>';
}

function tabMetadatos(box){
  const e = App.editing, m = e.m;
  box.innerHTML = '<div class="pane active"><div class="pane-inner">' +
    '<div class="panel">' +
      '<h3>Identidad del artículo</h3><div class="sub">Definen el nombre del archivo, la URL pública y lo que ven Google y las redes.</div>' +
      '<div class="field"><label>Título <span id="cTitle"></span></label>' +
        '<input type="text" id="fTitle" placeholder="Cómo conseguir carga para tu camión en Chile">' +
        '<div class="hint">Va en <code>&lt;title&gt;</code>, <code>og:title</code> y <code>twitter:title</code>. Ideal: 50–65 caracteres.</div></div>' +
      '<div class="row">' +
        '<div class="field"><label>Slug (nombre del archivo)</label>' +
          '<div class="inline"><input type="text" id="fSlug" style="flex:1" placeholder="como-conseguir-carga-para-tu-camion">' +
          '<button class="btn sm" id="bSlug" title="Derivar del título"><ion-icon name="refresh-outline"></ion-icon> Del título</button></div>' +
          '<div class="hint">Solo minúsculas, números y guiones. Archivo: <code id="hSlugFile"></code></div></div>' +
        '<div class="field"><label>Titular para datos estructurados (headline)</label>' +
          '<input type="text" id="fHeadline" placeholder="(por defecto, el título)">' +
          '<div class="hint">Puede ser más largo que el <code>&lt;title&gt;</code>. Se usa en el JSON-LD de <code>BlogPosting</code>.</div></div>' +
      '</div>' +
      '<div class="field"><label>Meta description <span id="cDesc"></span></label>' +
        '<textarea id="fDesc" rows="3" placeholder="Resumen de 120–160 caracteres que aparece en los resultados de búsqueda."></textarea>' +
        '<div class="hint">Se replica en <code>description</code>, <code>og:description</code>, <code>twitter:description</code> y el JSON-LD.</div></div>' +
    '</div>' +

    '<div class="panel">' +
      '<h3>URL canónica</h3><div class="sub">Le dice a Google cuál es la dirección oficial del artículo.</div>' +
      '<div class="field"><label>Canonical</label><input type="url" id="fCanon">' +
        '<div class="inline" style="margin-top:6px">' +
          '<button class="btn sm" data-canon="www">www.chiletransportistas.com/blog/{slug}/</button>' +
          '<button class="btn sm" data-canon="blog">blog.chiletransportistas.com/articulos/{slug}/</button>' +
        '</div>' +
        '<div class="hint">Los artículos publicados usan el patrón <code>www</code>. El archivo se sirve en <code>' + esc(SITE.liveUrlPattern) + '</code>.</div></div>' +
    '</div>' +

    '<div class="panel">' +
      '<h3>Autoría y fechas</h3>' +
      '<div class="row">' +
        '<div class="field"><label>Autor</label><input type="text" id="fAuthor"></div>' +
        '<div class="field"><label>Fecha de publicación</label><input type="date" id="fPub"></div>' +
        '<div class="field"><label>Última modificación</label><input type="date" id="fMod">' +
          '<div class="hint"><button class="btn sm ghost" id="bToday" style="padding:2px 6px">Poner hoy</button></div></div>' +
      '</div>' +
    '</div>' +

    '<div class="panel">' +
      '<h3>Modo de escritura del archivo</h3>' +
      '<div class="sub">Cómo se genera el HTML final al guardar, publicar o crear el pull request.</div>' +
      '<label class="checkline"><input type="radio" name="wmode" value="preserve" ' + (e.mode==='preserve'?'checked':'') + (e.original?'':' disabled') + '>' +
        '<span>Conservador — <b>recomendado para artículos existentes</b>' +
        '<small>Parte del archivo original y solo reescribe título, metadatos, JSON-LD y el contenido de <code>&lt;article&gt;</code>. Todo lo demás (scripts propios, estilos embebidos, includes SSI, espaciado) queda intacto.</small></span></label>' +
      '<label class="checkline"><input type="radio" name="wmode" value="rebuild" ' + (e.mode==='rebuild'?'checked':'') + '>' +
        '<span>Reconstruir desde la plantilla del sitio' +
        '<small>Regenera todo el documento con la plantilla estándar (misma cabecera, mismos includes SSI y mismo orden que los artículos publicados). Se conservan los extras del <code>&lt;head&gt;</code> y los scripts del final que ya tuviera el artículo.</small></span></label>' +
      (e.original ? '' : '<div class="hint">Un artículo nuevo siempre se construye con la plantilla.</div>') +
    '</div>' +

    (m.headExtra || m.tail ? '<div class="panel">' +
      '<h3>Bloques propios conservados</h3><div class="sub">Se copian tal cual al archivo final. Edítalos solo si sabes lo que hacen.</div>' +
      (m.headExtra ? '<div class="field"><label>Extras dentro de &lt;head&gt; (' + m.headExtra.length + ' caracteres)</label>' +
        '<textarea id="fHeadExtra" class="code" rows="8"></textarea>' +
        '<div class="hint">Ej.: JSON-LD de FAQ, estilos del artículo, Chart.js.</div></div>' : '') +
      (m.tail ? '<div class="field"><label>Scripts al final del documento (' + m.tail.length + ' caracteres)</label>' +
        '<textarea id="fTail" class="code" rows="8"></textarea>' +
        '<div class="hint">Van después del include del footer y antes de <code>&lt;/body&gt;</code>.</div></div>' : '') +
    '</div>' : '') +
  '</div></div>';

  bindField('fTitle', ()=>m.title, v => { m.title = v; if(!m.headline || m.headline === m.title) m.headline = v;
    $('#cTitle').outerHTML = counter('cTitle', v, 30, 65); });
  $('#cTitle').outerHTML = counter('cTitle', m.title, 30, 65);
  bindField('fSlug', ()=>m.slug, v => { m.slug = v; e.slug = v; $('#hSlugFile').textContent = SITE.articlesDir + '/' + (v||'…') + '.html'; });
  $('#hSlugFile').textContent = SITE.articlesDir + '/' + (m.slug || '…') + '.html';
  bindField('fHeadline', ()=>m.headline === m.title ? '' : m.headline, v => m.headline = v || m.title);
  bindField('fDesc', ()=>m.description, v => { m.description = v; $('#cDesc').outerHTML = counter('cDesc', v, 120, 160); });
  $('#cDesc').outerHTML = counter('cDesc', m.description, 120, 160);
  bindField('fCanon', ()=>m.canonical, v => m.canonical = v);
  bindField('fAuthor', ()=>m.author, v => m.author = v);

  $('#fPub').value = dateInputValue(m.datePublished);
  $('#fPub').oninput = ev => { m.datePublished = toIsoUtc(ev.target.value); markDirty(); };
  $('#fMod').value = dateInputValue(m.dateModified);
  $('#fMod').oninput = ev => { m.dateModified = toIsoUtc(ev.target.value); markDirty(); };
  $('#bToday').onclick = () => { m.dateModified = isoNow(); $('#fMod').value = dateInputValue(m.dateModified); markDirty(); toast('Fecha de modificación actualizada'); };

  $('#bSlug').onclick = () => {
    const s = slugify(m.title);
    if(!s) return toast('Escribe primero el título', 'warn');
    m.slug = s; e.slug = s;
    $('#fSlug').value = s; $('#hSlugFile').textContent = SITE.articlesDir + '/' + s + '.html';
    if(!m.canonical || /\{slug\}|\/$/.test(m.canonical) || e.isNew) { m.canonical = canonicalFor(s); $('#fCanon').value = m.canonical; }
    if(e.isNew || !m.image){ m.image = imageFor(s); }
    markDirty(); updateEdHead(); toast('Slug: ' + s, 'ok');
  };
  $$('[data-canon]').forEach(b => b.onclick = () => {
    if(!m.slug) return toast('Define primero el slug', 'warn');
    m.canonical = SITE.canonicalPatterns[b.dataset.canon].replace('{slug}', m.slug);
    $('#fCanon').value = m.canonical; markDirty();
  });
  $$('input[name=wmode]').forEach(r => r.onchange = () => { e.mode = r.value; markDirty(); updateEdHead(); });
  const he = $('#fHeadExtra'); if(he){ he.value = m.headExtra; he.oninput = () => { m.headExtra = he.value; markDirty(); }; }
  const tl = $('#fTail'); if(tl){ tl.value = m.tail; tl.oninput = () => { m.tail = tl.value; markDirty(); }; }
}

function tabPortada(box){
  const e = App.editing, m = e.m;
  const expected = m.slug ? imageFor(m.slug) : '';
  box.innerHTML = '<div class="pane active"><div class="pane-inner">' +
    '<div class="panel">' +
      '<h3>Imagen de portada</h3>' +
      '<div class="sub">La URL del CDN es predecible desde el slug, así que se puede escribir en el <code>&lt;head&gt;</code> antes de publicar.</div>' +
      '<div class="field"><label>URL de la portada (og:image / twitter:image / JSON-LD)</label>' +
        '<div class="inline"><input type="url" id="fImg" style="flex:1">' +
        '<button class="btn sm" id="bImg" ' + (expected?'':'disabled') + '><ion-icon name="refresh-outline"></ion-icon> Desde el slug</button></div>' +
        (expected ? '<div class="hint">Esperada: <code>' + esc(expected) + '</code></div>' : '<div class="hint">Define el slug para calcularla.</div>') +
      '</div>' +
      '<div style="border:1px solid var(--line);border-radius:9px;overflow:hidden;background:#f7f9fb;aspect-ratio:16/9;display:grid;place-items:center">' +
        (m.image ? '<img src="' + escAttr(m.image) + '" style="width:100%;height:100%;object-fit:cover" onerror="this.replaceWith(Object.assign(document.createElement(\'div\'),{className:\'muted\',style:\'font-size:12px;padding:20px;text-align:center\',textContent:\'La imagen aún no existe en el CDN. Se genera al publicar con la API.\'}))">'
                  : '<div class="muted" style="font-size:12px">Sin portada definida</div>') +
      '</div>' +
    '</div>' +
    '<div class="panel">' +
      '<h3>Generación de la portada (API del droplet)</h3>' +
      '<div class="sub">Al publicar, el endpoint genera la imagen con OpenAI y la sube al CDN. Si ya existe para este slug, la reutiliza.</div>' +
      '<div class="field"><label>Prompt de la escena</label>' +
        '<textarea id="fPrompt" rows="3" placeholder="camión rampla en la Ruta 5 al atardecer, vista lateral, cordillera de fondo"></textarea>' +
        '<div class="hint">Describe <b>solo la escena</b>. El servidor ya agrega el estilo, el contexto de transporte chileno y la restricción de “sin texto”. No pidas logos ni marcas.</div></div>' +
      '<label class="checkline"><input type="checkbox" id="fRegen"><span>Regenerar aunque ya exista<small>Consume crédito de OpenAI. Solo si la portada actual no sirve.</small></span></label>' +
      '<label class="checkline"><input type="checkbox" id="fSkipImg"><span>Publicar sin tocar la imagen (<code>skipImage</code>)<small>Recomendado cuando solo corriges texto de un artículo ya publicado.</small></span></label>' +
    '</div>' +
    '<div class="panel">' +
      '<h3>Texto alternativo de la imagen del cuerpo</h3>' +
      '<div class="field"><label>alt</label><input type="text" id="fAlt" placeholder="camiones en fila esperando carga">' +
      '<div class="hint">Se usa como <code>alt</code> por defecto al insertar la portada en el cuerpo y en la tarjeta del índice.</div></div>' +
    '</div>' +
  '</div></div>';
  bindField('fImg', ()=>m.image, v => m.image = v);
  bindField('fAlt', ()=>m.imageAlt, v => m.imageAlt = v);
  bindField('fPrompt', ()=>e.imagePrompt, v => e.imagePrompt = v);
  $('#fRegen').checked = !!e.regenerate;   $('#fRegen').onchange = ev => e.regenerate = ev.target.checked;
  $('#fSkipImg').checked = !!e.skipImage;  $('#fSkipImg').onchange = ev => e.skipImage = ev.target.checked;
  const bi = $('#bImg'); if(bi) bi.onclick = () => { m.image = imageFor(m.slug); $('#fImg').value = m.image; markDirty(); tabPortada(box); };
}

function tabIndice(box){
  const e = App.editing, m = e.m, c = e.indexCard;
  const has = App.indexHtml ? IndexPage.has(App.indexHtml, m.slug) : null;
  const year = yearOf(m.datePublished);
  const preview = IndexPage.cardHtml({
    slug: m.slug || 'slug', title: m.title || 'Título', image: m.image,
    alt: c.alt || m.imageAlt || m.title, date: cardDate(m.datePublished), tag: c.tag, year
  });
  box.innerHTML = '<div class="pane active"><div class="pane-inner">' +
    '<div class="panel">' +
      '<h3>Tarjeta en <code>' + SITE.indexFile + '</code></h3>' +
      '<div class="sub">El listado del blog no se genera solo: cada artículo tiene una tarjeta en su sección de año. El CMS puede incluir ese cambio en el mismo pull request.</div>' +
      (App.indexHtml
        ? '<div class="inline" style="margin-bottom:12px">' +
            (has ? '<span class="chip ok"><span class="dot"></span>Ya tiene tarjeta</span>' : '<span class="chip warn"><span class="dot"></span>Sin tarjeta en el índice</span>') +
            '<span class="chip mute">Sección ' + year + '</span>' +
            '<span class="muted" style="font-size:11.5px">índice leído desde ' + esc(App.indexSource || '—') + '</span>' +
          '</div>'
        : '<div class="vitem warn" style="margin-bottom:12px"><div class="ic"><ion-icon name="warning-outline"></ion-icon></div><div class="tx"><b>No se pudo leer ' + SITE.indexFile + '</b>' +
          'Conecta la carpeta local o la API para que el CMS pueda actualizar el listado del blog.</div></div>') +
      '<label class="checkline"><input type="checkbox" id="ixOn" ' + (c.enabled?'checked':'') + (App.indexHtml?'':' disabled') + '>' +
        '<span>Actualizar el índice junto con el artículo<small>Se agrega o se reemplaza la tarjeta en la sección ' + year + ' de <code>' + SITE.indexFile + '</code>.</small></span></label>' +
      '<div class="row">' +
        '<div class="field"><label>Etiqueta de la tarjeta</label><input type="text" id="ixTag" placeholder="Guía práctica">' +
          '<div class="hint">Texto corto a la derecha de la fecha.</div></div>' +
        '<div class="field"><label>alt de la miniatura</label><input type="text" id="ixAlt"></div>' +
      '</div>' +
      '<div class="field"><label>Vista previa del bloque que se insertará</label>' +
        '<div class="diffbox">' + esc(preview) + '</div></div>' +
    '</div>' +
  '</div></div>';
  const on = $('#ixOn'); on.onchange = () => { c.enabled = on.checked; markDirty(); };
  bindField('ixTag', ()=>c.tag, v => { c.tag = v; tabIndiceRefresh(); });
  bindField('ixAlt', ()=>c.alt || m.imageAlt, v => { c.alt = v; tabIndiceRefresh(); });
}
const tabIndiceRefresh = debounce(() => { if(App.editing && App.editing.tab === 'indice') tabIndice($('#edBody')); }, 500);

function tabRevision(box){
  const e = App.editing;
  syncFromEditor();
  const html = currentHtml();
  const v = validate(html, e.m);
  const errs = v.filter(x => x.level==='error'), warns = v.filter(x => x.level==='warn'), oks = v.filter(x => x.level==='ok');
  const nErr = countErrors(v), nWarn = countWarns(v);
  const item = x => '<div class="vitem ' + x.level + '"><div class="ic">' + (x.level==='error'?'<ion-icon name="close-circle-outline"></ion-icon>':x.level==='warn'?'<ion-icon name="warning-outline"></ion-icon>':'<ion-icon name="checkmark-circle-outline"></ion-icon>') + '</div>' +
    '<div class="tx"><b>' + x.title + '</b>' + (x.detail || '') + '</div></div>';
  const diff = e.original ? renderDiff(e.original, html) : '<div class="muted" style="font-size:12.5px">Artículo nuevo: no hay versión anterior con la que comparar.</div>';
  box.innerHTML = '<div class="pane active"><div class="pane-inner pane-wide">' +
    '<div class="panel">' +
      '<h3>Revisión previa</h3>' +
      '<div class="inline" style="margin-bottom:12px">' +
        '<span class="chip ' + (nErr?'err':'ok') + '">' + nErr + ' error(es)</span>' +
        '<span class="chip ' + (nWarn?'warn':'mute') + '">' + nWarn + ' aviso(s)</span>' +
        '<span class="chip mute">' + oks.length + ' verificación(es) OK</span>' +
      '</div>' +
      '<div class="vlist">' + errs.map(item).join('') + warns.map(item).join('') + oks.map(item).join('') + '</div>' +
    '</div>' +
    '<div class="panel"><h3>Cambios respecto del archivo actual</h3>' +
      '<div class="sub">Esto es exactamente lo que irá al pull request.</div>' + diff + '</div>' +
  '</div></div>';
}

function tabDocumento(box){
  const e = App.editing;
  syncFromEditor();
  const html = currentHtml();
  box.innerHTML = '<div class="pane active"><div style="display:flex;flex-direction:column;height:100%">' +
    '<div class="toolbar">' +
      '<span class="muted" style="font-size:11.5px;margin-right:auto">' + SITE.articlesDir + '/' + esc(e.m.slug || '…') + '.html · ' + bytes(html.length) + '</span>' +
      '<button class="btn sm" data-doc="copy">Copiar</button>' +
      '<button class="btn sm" data-doc="download">Descargar</button>' +
      '<button class="btn sm" data-doc="replace">Reemplazar por HTML pegado…</button>' +
    '</div>' +
    '<div class="codewrap"><textarea class="code" id="docSrc" spellcheck="false" readonly></textarea></div>' +
  '</div></div>';
  $('#docSrc').value = html;
  $('[data-doc=copy]').onclick     = () => copy(html).then(()=>toast('HTML copiado','ok'));
  $('[data-doc=download]').onclick = () => download((e.m.slug || 'articulo') + '.html', html);
  $('[data-doc=replace]').onclick  = async () => {
    const v = await promptModal({ title:'Reemplazar por HTML pegado', multiline:true, rows:16, value:'',
      label:'Pega el documento completo del artículo', ok:'Cargar',
      hint:'Se leen título, metadatos, JSON-LD, includes SSI y el cuerpo del <code>&lt;article&gt;</code>. Úsalo para traer un artículo generado fuera del CMS.' });
    if(!v || !v.trim()) return;
    importHtmlInto(v, e);
  };
}

function tabPrevia(box){
  const e = App.editing;
  syncFromEditor();
  box.innerHTML = '<div class="pane active"><div class="pv">' +
    '<div class="bar">' +
      '<span class="muted" style="font-size:11.5px;margin-right:auto">Vista previa con los includes SSI resueltos' +
      (Object.keys(App.includes).length ? '' : ' (sin includes cargados: se muestran como bloques marcados)') + '</span>' +
      '<button class="btn sm" data-pv="desk"><ion-icon name="desktop-outline"></ion-icon> Escritorio</button>' +
      '<button class="btn sm" data-pv="tab"><ion-icon name="tablet-portrait-outline"></ion-icon> Tablet</button>' +
      '<button class="btn sm" data-pv="mob"><ion-icon name="phone-portrait-outline"></ion-icon> Móvil</button>' +
      '<button class="btn sm ghost" data-pv="new"><ion-icon name="open-outline"></ion-icon> Abrir en pestaña</button>' +
    '</div>' +
    '<iframe id="pvFrameBig" class="w-desk" sandbox="allow-scripts allow-popups"></iframe>' +
  '</div></div>';
  const fr = $('#pvFrameBig');
  fr.srcdoc = previewDoc(currentHtml());
  $$('[data-pv]').forEach(b => b.onclick = () => {
    if(b.dataset.pv === 'new'){
      const url = URL.createObjectURL(new Blob([previewDoc(currentHtml())], {type:'text/html;charset=utf-8'}));
      const w = window.open(url, '_blank', 'noopener');
      if(w) setTimeout(() => URL.revokeObjectURL(url), 60000);
      else { URL.revokeObjectURL(url); toast('El navegador bloqueó la ventana emergente', 'warn'); }
      return;
    }
    fr.className = 'w-' + b.dataset.pv;
  });
}
</script>
<script>
/* ==============================================================
   17. Acciones: guardar, publicar, pull request, eliminar
   ============================================================== */

function articlePath(slug){ return SITE.articlesDir + '/' + slug + '.html'; }

function importHtmlInto(html, e){
  const m = Article.parse(html);
  const guess = m.slug || slugify(m.title);
  m.slug = e.m.slug || guess;
  if(!m.canonical) m.canonical = canonicalFor(m.slug);
  if(!m.image)     m.image = imageFor(m.slug);
  e.m = m;
  e.original = e.original || null;
  e.baseline = e.original ? Article.parse(e.original) : null;
  e.rteTouched = true;
  e.mode = e.original ? 'preserve' : 'rebuild';
  markDirty();
  toast('HTML cargado: ' + (m.title || m.slug), 'ok');
  renderEditor();
}

async function preflight(){
  const e = App.editing;
  syncFromEditor();
  if(!e.m.slug || !validSlug(e.m.slug)){
    toast('El slug es obligatorio y solo admite minúsculas, números y guiones', 'err', 5000);
    e.tab = 'metadatos'; renderEditor(); return false;
  }
  if(!e.m.title){ toast('Falta el título', 'err'); e.tab = 'metadatos'; renderEditor(); return false; }
  const v = validate(currentHtml(), e.m);
  const errs = v.filter(x => x.level === 'error');
  if(errs.length){
    const go = await confirmModal({
      title: errs.length + ' error(es) de validación',
      danger: true, ok: 'Continuar igual', cancel: 'Volver y corregir',
      html: '<p style="margin:0 0 12px;font-size:13px">La revisión encontró problemas que pueden romper el artículo en producción:</p>' +
        '<div class="vlist">' + errs.map(x => '<div class="vitem err"><div class="ic"><ion-icon name="close-circle-outline"></ion-icon></div><div class="tx"><b>' + x.title + '</b>' + (x.detail||'') + '</div></div>').join('') + '</div>'
    });
    if(!go){ e.tab = 'revision'; renderEditor(); return false; }
  }
  return true;
}

/* ---- guardar en la carpeta local ---- */
async function doSaveLocal(){
  const e = App.editing; if(!e) return;
  syncFromEditor();
  if(!LocalFs.root) return toast('Conecta la carpeta local con permiso de escritura (Chrome, Edge o Brave)', 'warn', 5500);
  if(!e.m.slug || !validSlug(e.m.slug)) return toast('Slug inválido', 'err');
  const path = articlePath(e.m.slug);
  const html = currentHtml();
  const id = Log.start('Guardar en carpeta local', path);
  try{
    await LocalFs.write(path, html);
    let idxNote = null;
    if(e.indexCard.enabled && App.indexHtml){
      const res = IndexPage.upsert(App.indexHtml, indexCardFor(e));
      App.indexHtml = res.html;
      await LocalFs.write(SITE.indexFile, res.html);
      idxNote = SITE.indexFile + ': tarjeta ' + res.action;
    }
    const r = record(e.m.slug);
    r.local = { path, size: html.length, mtime: Date.now(), html };
    r.meta = Object.assign({}, e.m);
    e.original = html; e.baseline = Article.parse(html); e.baseline.slug = e.m.slug;
    e.mode = 'preserve'; e.isNew = false; e.dirty = false; e.rteTouched = false;
    Log.finish(id, 'ok', { archivo: path, bytes: html.length, indice: idxNote });
    toast('Guardado en ' + path + (idxNote ? ' · ' + idxNote : ''), 'ok', 4200);
    updateEdHead(); updateCounts();
  }catch(err){
    Log.finish(id, 'error', String(err.message || err));
    toast('No se pudo guardar: ' + (err.message || err), 'err', 6000);
  }
}

function indexCardFor(e){
  const m = e.m, c = e.indexCard;
  return {
    slug: m.slug, title: m.title, image: m.image,
    alt: c.alt || m.imageAlt || m.title,
    date: cardDate(m.datePublished), tag: c.tag || '',
    year: yearOf(m.datePublished)
  };
}

/* ---- crear pull request ---- */
async function doCreatePr(){
  const e = App.editing; if(!e) return;
  if(!Api.ready()) return openSettings('Configura la URL de la API y el token para crear pull requests.');
  if(!(await preflight())) return;

  const html = currentHtml();
  const path = articlePath(e.m.slug);
  const isNew = !App.items[e.m.slug] || !App.items[e.m.slug].remote;
  const files = [{ path, content: html }];

  /* Si se cambió el slug de un artículo que ya existía, el archivo anterior
     quedaría huérfano en el repositorio. Se pregunta qué hacer con él. */
  let slugPrevio = null;
  if(!e.isNew && e.baseline && e.baseline.slug && e.baseline.slug !== e.m.slug){
    slugPrevio = e.baseline.slug;
    const q = await confirmModal({
      title: 'Cambiaste el slug', ok: 'Sí, eliminar el anterior', cancel: 'No, dejar los dos',
      html: '<p style="margin:0 0 12px;font-size:13px;line-height:1.6">El artículo pasa de ' +
        '<code>' + esc(articlePath(slugPrevio)) + '</code> a <code>' + esc(path) + '</code>.</p>' +
        '<p style="margin:0 0 12px;font-size:13px;line-height:1.6">¿Incluir en el mismo pull request la eliminación del archivo anterior? ' +
        'Si lo dejas, quedarán dos artículos con el mismo contenido y la URL vieja seguirá viva.</p>' +
        '<div class="vitem warn"><div class="ic"><ion-icon name="warning-outline"></ion-icon></div><div class="tx"><b>Si eliminas la URL anterior</b>' +
        'Conviene dejar una redirección 301 hacia la nueva para no perder el posicionamiento.</div></div>'
    });
    if(q) files.push({ path: articlePath(slugPrevio), content: null });
    else slugPrevio = null;
  }

  let idxAction = null, idxHtml = null;
  if(e.indexCard.enabled && App.indexHtml){
    let baseIdx = App.indexHtml;
    if(slugPrevio){ baseIdx = IndexPage.remove(baseIdx, slugPrevio).html; }
    const res = IndexPage.upsert(baseIdx, indexCardFor(e));
    idxHtml = res.html; idxAction = res.action + (slugPrevio ? ' (y se quitó la de ' + slugPrevio + ')' : '');
    if(idxHtml !== App.indexHtml) files.push({ path: SITE.indexFile, content: idxHtml });
  }

  const defTitle = (isNew ? 'Nuevo artículo: ' : 'Edición: ') + e.m.title;
  const ok = await confirmModal({
    title: 'Crear pull request',
    ok: 'Crear pull request', cancel: 'Cancelar',
    html:
      '<div class="field"><label>Título del pull request</label><input type="text" id="prT" value="' + escAttr(defTitle) + '" data-autofocus></div>' +
      '<div class="field"><label>Notas (opcional)</label><textarea id="prN" rows="3" placeholder="Qué cambió y por qué."></textarea></div>' +
      '<div class="panel" style="margin:0;background:#fafbfc">' +
        '<div style="font-size:12px;font-weight:700;margin-bottom:8px">Archivos incluidos</div>' +
        files.map(f => '<div class="inline" style="font-size:12px;margin-bottom:5px"><span class="chip ' + (f.path===path && isNew ? 'ok' : 'info') + '">' +
          (f.path === path ? (isNew ? 'nuevo' : 'modificado') : 'modificado') + '</span><code class="mono">' + esc(f.path) + '</code>' +
          '<span class="muted">' + bytes(f.content.length) + '</span></div>').join('') +
        (idxAction ? '<div class="hint" style="margin-top:6px">Índice: tarjeta ' + esc(idxAction) + '</div>' : '') +
        '<div class="hint" style="margin-top:8px">Base: <code>' + esc(S.baseBranch) + '</code> · Repo: <code>' + esc((App.serverInfo && App.serverInfo.repo) || S.repo) + '</code></div>' +
      '</div>'
  });
  if(!ok) return;
  const prTitle = (ok.v && ok.v.prT) || defTitle;
  const prNotes = (ok.v && ok.v.prN) || '';

  const body =
    (prNotes ? prNotes + '\n\n' : '') +
    '### ' + (isNew ? 'Artículo nuevo' : 'Edición de artículo') + '\n\n' +
    '| | |\n|---|---|\n' +
    '| **Slug** | `' + e.m.slug + '` |\n' +
    '| **Título** | ' + e.m.title.replace(/\|/g,'\\|') + ' |\n' +
    '| **URL** | ' + SITE.liveUrlPattern.replace('{slug}', e.m.slug) + ' |\n' +
    '| **Canonical** | ' + e.m.canonical + ' |\n' +
    '| **Portada** | ' + (e.m.image || '—') + ' |\n' +
    '| **Palabras** | ' + wordCount(e.m.body) + ' |\n' +
    '| **Modo** | ' + (e.mode === 'preserve' ? 'edición conservadora sobre el archivo original' : 'reconstruido desde la plantilla del sitio') + ' |\n\n' +
    '**Includes SSI en el documento:** ' + Article.ssiList(html).map(x => '`' + x.path + '`').join(', ') + '\n\n' +
    (idxAction ? '**`' + SITE.indexFile + '`:** tarjeta ' + idxAction + '\n\n' : '') +
    (slugPrevio ? '> ⚠️ El slug cambió: este pull request elimina `' + articlePath(slugPrevio) +
      '`. Conviene agregar una redirección 301 de la URL anterior a la nueva.\n\n' : '') +
    '---\n_Generado desde CHTR Blog CMS._';

  const id = Log.start(isNew ? 'Pull request: artículo nuevo' : 'Pull request: edición', path,
    { archivos: files.map(f => f.path), rama_base: S.baseBranch });
  try{
    const res = await Api.pr({
      action: isNew ? 'create' : 'update',
      slug: e.m.slug, title: prTitle, body, files,
      labels: String(S.prLabels || '').split(',').map(s => s.trim()).filter(Boolean),
      reviewers: String(S.prReviewers || '').split(',').map(s => s.trim()).filter(Boolean),
      base: S.baseBranch
    });
    Log.finish(id, 'ok', res);
    if(idxHtml) App.indexHtml = idxHtml;
    e.dirty = false; updateEdHead();
    await loadPrs(true); updateCounts();
    prSuccessModal(res, files);
  }catch(err){
    Log.finish(id, 'error', { status: err.status, error: String(err.message || err), detalle: err.body });
    toast('Pull request: ' + (err.message || err), 'err', 7000);
    $('#drawer').classList.add('open'); Log.render();
  }
}

function prSuccessModal(res, files){
  const m = openModal(
    '<div class="mh"><ion-icon name="checkmark-circle-outline"></ion-icon><h3>Pull request creado</h3></div>' +
    '<div class="mb">' +
      '<div class="inline" style="margin-bottom:12px"><span class="chip ok"><span class="dot"></span>#' + esc(res.prNumber) + '</span>' +
      '<code class="mono" style="font-size:11.5px">' + esc(res.branch || '') + '</code></div>' +
      '<p style="margin:0 0 12px;font-size:13px;line-height:1.6">Los cambios están en una rama aparte. Nada llegó todavía a producción: revisa el pull request y haz merge cuando esté conforme.</p>' +
      (files||[]).map(f => '<div class="inline" style="font-size:12px;margin-bottom:4px"><span class="chip info">' + esc(f.path) + '</span></div>').join('') +
    '</div>' +
    '<div class="mf">' +
      '<button class="btn left" data-x="c">Cerrar</button>' +
      '<button class="btn primary" data-x="o"><ion-icon name="open-outline"></ion-icon> Abrir el pull request</button>' +
    '</div>');
  m.querySelector('[data-x=c]').onclick = () => closeModal(null);
  m.querySelector('[data-x=o]').onclick = () => { window.open(res.prUrl, '_blank', 'noopener'); closeModal(null); };
}

/* ---- publicar directo con la API existente ---- */
async function doPublish(overwrite){
  const e = App.editing; if(!e) return;
  if(!Api.ready()) return openSettings('Configura la URL de la API y el token para publicar.');
  if(!(await preflight())) return;

  const html = currentHtml();
  const url  = SITE.liveUrlPattern.replace('{slug}', e.m.slug);
  /* El endpoint de publicación solo escribe el artículo: el listado del blog
     es un archivo aparte y hay que actualizarlo por separado. */
  const sinTarjeta = !!App.indexHtml && !IndexPage.has(App.indexHtml, e.m.slug);

  if(!overwrite){
    const ok = await confirmModal({
      title: 'Publicar en producción',
      ok: 'Publicar ahora', cancel: 'Cancelar', danger: true,
      html:
        '<p style="margin:0 0 12px;font-size:13px;line-height:1.6">Esto escribe el archivo en el servidor y lo deja <b>visible en producción</b> de inmediato. No pasa por pull request.</p>' +
        '<div class="panel" style="margin:0;background:#fafbfc">' +
          '<div style="font-size:12px;line-height:1.9">' +
            '<div><b>Slug:</b> <code>' + esc(e.m.slug) + '</code></div>' +
            '<div><b>Título:</b> ' + esc(e.m.title) + '</div>' +
            '<div><b>URL:</b> <a href="' + escAttr(url) + '" target="_blank" rel="noopener">' + esc(url) + '</a></div>' +
            '<div><b>Portada:</b> ' + (e.skipImage ? '<span class="chip mute">omitida (skipImage)</span>' : (e.regenerate ? '<span class="chip warn">se regenera</span>' : '<span class="chip info">se genera o reutiliza</span>')) + '</div>' +
            (e.imagePrompt ? '<div><b>Prompt:</b> ' + esc(e.imagePrompt) + '</div>' : '') +
          '</div>' +
        '</div>' +
        '<div class="hint" style="margin-top:10px">Generar la portada tarda 30–60 s. El límite de Cloudflare son 100 s.</div>' +
        (sinTarjeta
          ? '<div class="vitem warn" style="margin-top:10px"><div class="ic"><ion-icon name="warning-outline"></ion-icon></div><div class="tx">' +
            '<b>No aparecerá en el listado del blog</b>Publicar solo escribe <code>' + esc(articlePath(e.m.slug)) + '</code>: ' +
            'no toca <code>' + SITE.indexFile + '</code>. El artículo quedará online y accesible por su URL, pero sin tarjeta en ' +
            '<code>' + SITE.indexFile + '</code> nadie llegará a él desde el blog. Actualiza el índice con un pull request, ' +
            'o desde la pestaña Índice si trabajas con la carpeta local.</div></div>'
          : '')
    });
    if(!ok) return;
  }

  const payload = {
    slug: e.m.slug, title: e.m.title, html,
    image: { prompt: e.imagePrompt || '', regenerate: !!e.regenerate },
    overwrite: !!overwrite, skipImage: !!e.skipImage
  };
  const id = Log.start('Publicar artículo', e.m.slug, { url, skipImage: !!e.skipImage, regenerate: !!e.regenerate });
  toast('Publicando… la portada puede tardar hasta un minuto', 'warn', 6000);
  try{
    const res = await Api.publish(payload);
    Log.finish(id, 'ok', res);
    const r = record(e.m.slug);
    r.remote = Object.assign(r.remote || {}, { slug: e.m.slug, title: e.m.title, html, path: articlePath(e.m.slug) });
    e.dirty = false; updateEdHead(); updateCounts();
    const mm = openModal(
      '<div class="mh"><ion-icon name="rocket-outline"></ion-icon><h3>Artículo publicado</h3></div><div class="mb">' +
      '<div class="inline" style="margin-bottom:10px"><span class="chip ok"><span class="dot"></span>' + esc(res.imageStatus || 'ok') + '</span>' +
      (res.sitemap ? '<span class="chip ' + (res.sitemap==='ok'?'ok':'mute') + '">sitemap: ' + esc(res.sitemap) + '</span>' : '') + '</div>' +
      '<div style="font-size:12.5px;line-height:1.9">' +
        '<div><b>Artículo:</b> <a href="' + escAttr(res.articleUrl||url) + '" target="_blank" rel="noopener">' + esc(res.articleUrl||url) + '</a></div>' +
        (res.imageUrl ? '<div><b>Portada:</b> <a href="' + escAttr(res.imageUrl) + '" target="_blank" rel="noopener">ver imagen</a></div>' : '') +
        (res.filePath ? '<div><b>Archivo:</b> <code>' + esc(res.filePath) + '</code></div>' : '') +
      '</div>' +
      (res.sitemap === 'disabled' ? '<div class="vitem warn" style="margin-top:12px"><div class="ic"><ion-icon name="warning-outline"></ion-icon></div><div class="tx"><b>Sitemap deshabilitado</b>El artículo no quedó en <code>sitemap-blog.xml</code>. Actualízalo aparte.</div></div>' : '') +
      '<div class="vitem warn" style="margin-top:10px"><div class="ic"><ion-icon name="warning-outline"></ion-icon></div><div class="tx"><b>Revisa la portada</b>Es lo único que no se puede previsualizar antes. Si no sirve, cámbiale el prompt y republica con “regenerar”.</div></div>' +
      (sinTarjeta ? '<div class="vitem warn" style="margin-top:10px"><div class="ic"><ion-icon name="warning-outline"></ion-icon></div><div class="tx">' +
        '<b>Falta la tarjeta en ' + SITE.indexFile + '</b>El artículo está online pero todavía no aparece en el listado del blog. ' +
        'Ve a la pestaña Índice y crea un pull request para agregarla.</div></div>' : '') +
      '</div><div class="mf"><button class="btn" data-x="c">Cerrar</button>' +
      '<button class="btn primary" data-x="o"><ion-icon name="open-outline"></ion-icon> Ver artículo</button></div>');
    mm.querySelector('[data-x=c]').onclick = () => closeModal(null);
    mm.querySelector('[data-x=o]').onclick = () => { window.open(res.articleUrl||url, '_blank', 'noopener'); closeModal(null); };
  }catch(err){
    Log.finish(id, 'error', { status: err.status, error: String(err.message||err), detalle: err.body });
    if(err.status === 409){
      const ow = await confirmModal({
        title: 'El artículo ya existe', danger: true, ok: 'Sobrescribir', cancel: 'Cancelar',
        html: '<p style="margin:0;font-size:13px;line-height:1.6">Ya hay un artículo publicado con el slug <code>' + esc(e.m.slug) +
              '</code>. Sobrescribir reemplaza el archivo en producción.</p>'
      });
      if(ow) return doPublish(true);
      return;
    }
    if(err.status === 401) toast('Token rechazado (401). Revisa el token del CMS en Ajustes.', 'err', 7000);
    else if(err.status === 524 || err.status === 0) toast('Sin respuesta a tiempo. Verifica si el artículo igual se publicó antes de reintentar.', 'err', 8000);
    else toast('Publicar: ' + (err.message || err), 'err', 7000);
    $('#drawer').classList.add('open'); Log.render();
  }
}

/* ---- eliminar ---- */
async function doDelete(slug){
  slug = slug || (App.editing && App.editing.m.slug);
  if(!slug) return;
  const r = App.items[slug];
  const hasRemote = !!(r && r.remote), hasLocal = !!(r && r.local);
  const ok = await confirmModal({
    title: 'Eliminar “' + slug + '”', danger: true, ok: 'Eliminar', cancel: 'Cancelar',
    html: '<p style="margin:0 0 12px;font-size:13px;line-height:1.6">Se creará un pull request que borra el archivo del repositorio. ' +
      'La página seguirá online hasta que ese PR se apruebe y se despliegue.</p>' +
      '<label class="checkline"><input type="checkbox" id="dPr" ' + (hasRemote?'checked':'') + (hasRemote?'':' disabled') + '>' +
        '<span>Pull request que elimina <code>' + esc(articlePath(slug)) + '</code></span></label>' +
      '<label class="checkline"><input type="checkbox" id="dIdx" ' + (App.indexHtml?'checked':'') + (App.indexHtml?'':' disabled') + '>' +
        '<span>Quitar también su tarjeta de <code>' + SITE.indexFile + '</code></span></label>' +
      '<label class="checkline"><input type="checkbox" id="dLocal" ' + (hasLocal?'checked':'') + (hasLocal?'':' disabled') + '>' +
        '<span>Borrar el archivo de la carpeta local</span></label>'
  });
  if(!ok) return;
  const wantPr    = !!(ok.v && ok.v.dPr);
  const wantIdx   = !!(ok.v && ok.v.dIdx);
  const wantLocal = !!(ok.v && ok.v.dLocal);

  if(wantPr && Api.ready()){
    const files = [{ path: articlePath(slug), content: null }];
    let idxAction = null;
    if(wantIdx && App.indexHtml){
      const res = IndexPage.remove(App.indexHtml, slug);
      if(res.html !== App.indexHtml){ files.push({ path: SITE.indexFile, content: res.html }); idxAction = res.action; App.indexHtml = res.html; }
    }
    const id = Log.start('Pull request: eliminar artículo', slug, { archivos: files.map(f=>f.path) });
    try{
      const res = await Api.pr({
        action:'delete', slug,
        title:'Eliminar artículo: ' + slug,
        body:'Elimina `' + articlePath(slug) + '` del blog.' + (idxAction ? '\n\nTambién quita su tarjeta de `' + SITE.indexFile + '` (' + idxAction + ').' : '') +
             '\n\n---\n_Generado desde CHTR Blog CMS._',
        files, base: S.baseBranch,
        labels: String(S.prLabels||'').split(',').map(s=>s.trim()).filter(Boolean)
      });
      Log.finish(id, 'ok', res);
      prSuccessModal(res, [{path: articlePath(slug)}]);
      await loadPrs(true);
    }catch(err){
      Log.finish(id, 'error', { status: err.status, error: String(err.message||err), detalle: err.body });
      toast('Eliminar: ' + (err.message||err), 'err', 7000);
    }
  }

  if(wantLocal && LocalFs.root){
    try{
      await LocalFs.remove(articlePath(slug));
      if(wantIdx && App.indexHtml) await LocalFs.write(SITE.indexFile, App.indexHtml);
      Log.add('Borrar archivo local', articlePath(slug), 'ok');
      if(App.items[slug]) App.items[slug].local = null;
      toast('Archivo local borrado', 'ok');
    }catch(err){ Log.add('Borrar archivo local', articlePath(slug), 'error', String(err.message||err)); }
  }

  if(App.items[slug] && !App.items[slug].local && !App.items[slug].remote) delete App.items[slug];
  if(App.editing && App.editing.m.slug === slug){ App.editing = null; App.view = 'library'; }
  updateCounts(); render();
}

    '</div>' +
    '</div><div class="mf">' +
      '<button class="btn left danger" id="sReset">Restablecer</button>' +
      '<button class="btn" data-x="c">Cancelar</button>' +
      '<button class="btn primary" data-x="o">Guardar ajustes</button>' +
    '</div>', {wide:true});

  $('#sCanon').value = S.canonicalMode;
  $('#sCanonC').style.display = S.canonicalMode === 'custom' ? '' : 'none';
  $('#sCanon').onchange = () => { $('#sCanonC').style.display = $('#sCanon').value === 'custom' ? '' : 'none'; };
  $('#sTogTok').onclick = () => { const i = $('#sTok'); i.type = i.type === 'password' ? 'text' : 'password'; };
  $('#sTest').onclick = async () => {
    const out = $('#sTestOut'); out.textContent = 'Probando…';
    const prev = { apiBase: S.apiBase, token: S.token };
    S.apiBase = $('#sBase').value.trim(); S.token = $('#sTok').value.trim();
    try{
      const h = await Api.health();
      App.serverInfo = h;
      out.innerHTML = '<span class="chip ok"><span class="dot"></span>OK</span> ' +
        esc(h.repo || '') + ' · rama ' + esc(h.branch || '') +
        (h.features ? ' · ' + esc(Object.keys(h.features).filter(k=>h.features[k]).join(', ')) : '');
      setConn('on', h.repo || 'conectado');
    }catch(err){
      out.innerHTML = '<span class="chip err"><span class="dot"></span>' + esc(err.status || 'sin respuesta') + '</span> ' + esc(err.message || '');
      S.apiBase = prev.apiBase; S.token = prev.token;
    }
  };
  $('#sReset').onclick = async () => {
    if(await confirmModal({title:'Restablecer ajustes', text:'Vuelve a los valores por defecto. No borra artículos ni borradores.', ok:'Restablecer', danger:true})){
      S = Object.assign({}, DEFAULT_SETTINGS); saveSettings(); closeModal(null); openSettings();
    }
  };
  m.querySelector('[data-x=c]').onclick = () => closeModal(null);
  m.querySelector('[data-x=o]').onclick = () => {
    S.apiBase        = $('#sBase').value.trim().replace(/\/+$/,'');
    S.token          = $('#sTok').value.trim();
    S.rememberToken  = $('#sRem').checked;
    S.repo           = $('#sRepo').value.trim();
    S.baseBranch     = $('#sBranch').value.trim() || 'main';
    S.prLabels       = $('#sLabels').value;
    S.prReviewers    = $('#sRev').value;
    S.author         = $('#sAuthor').value.trim();
    S.canonicalMode  = $('#sCanon').value;
    S.canonicalCustom= $('#sCanonC').value.trim();
    S.cdnPattern     = $('#sCdn').value.trim() || SITE.cdnPattern;
    S.updateIndex    = $('#sIdx').checked;
    saveSettings(); closeModal(null);
    toast('Ajustes guardados', 'ok');
    checkConn(); reloadAll(true);
  };
}
</script>
<script>
/* ==============================================================
   20. Importar HTML generado fuera del CMS
   ============================================================== */

async function importModal(){
  return new Promise(res => {
    modalResolve = res;
    const m = openModal(
      '<div class="mh"><h3>Importar artículo</h3></div><div class="mb">' +
      '<p style="margin:0 0 12px;font-size:12.5px;line-height:1.6;color:var(--ink-2)">Pega el documento HTML completo del artículo. ' +
      'El CMS extrae título, metadatos, JSON-LD, includes SSI y el cuerpo del <code>&lt;article&gt;</code>, y deja todo listo para revisar antes de publicar.</p>' +
      '<div class="field"><label>HTML del artículo</label>' +
      '<textarea id="imH" class="code" rows="14" spellcheck="false" data-autofocus placeholder="&lt;!DOCTYPE html&gt;&#10;&lt;html lang=&quot;es&quot;&gt;…"></textarea></div>' +
      '<div class="field"><label>Slug (opcional — se deduce del título si lo dejas vacío)</label><input type="text" id="imS" placeholder="como-conseguir-carga-para-tu-camion"></div>' +
      '<div class="hint">También puedes arrastrar un archivo <code>.html</code> sobre esta ventana.</div>' +
      '</div><div class="mf"><button class="btn" data-x="c">Cancelar</button>' +
      '<button class="btn primary" data-x="o">Importar</button></div>', {wide:true});
    const ta = m.querySelector('#imH');
    m.addEventListener('dragover', e => { e.preventDefault(); });
    m.addEventListener('drop', async e => {
      e.preventDefault();
      const f = e.dataTransfer.files && e.dataTransfer.files[0];
      if(f){ ta.value = await f.text(); if(!m.querySelector('#imS').value) m.querySelector('#imS').value = f.name.replace(/\.html?$/i,''); }
    });
    m.querySelector('[data-x=c]').onclick = () => closeModal(null);
    m.querySelector('[data-x=o]').onclick = () => {
      const html = ta.value.trim(), slug = m.querySelector('#imS').value.trim();
      closeModal(null);
      if(!html) return toast('No pegaste nada', 'warn');
      const mm = Article.parse(html);
      if(!mm.body) return toast('No se encontró un bloque <article> en el HTML pegado', 'err', 6000);
      mm.slug = slug || slugify(mm.title);
      if(!validSlug(mm.slug)) mm.slug = slugify(mm.slug);
      if(!mm.canonical) mm.canonical = canonicalFor(mm.slug);
      if(!mm.image)     mm.image = imageFor(mm.slug);
      const exists = !!App.items[mm.slug];
      const orig = exists ? (App.items[mm.slug].local && App.items[mm.slug].local.html) || null : null;
      App.editing = {
        slug: mm.slug, isNew: !exists, original: orig, baseline: orig ? Article.parse(orig) : null,
        mode: 'rebuild', m: mm, dirty: true, rteTouched: true, tab: 'revision', editorMode:'visual', showPreview:true, device:'desk',
        indexCard: { enabled: S.updateIndex, tag:'', alt: mm.imageAlt || '' },
        imagePrompt:'', draftId: 'draft_' + uid()
      };
      App.view = 'editor'; render();
      toast('Importado: ' + (mm.title || mm.slug) + (exists ? ' (ya existía: se editará)' : ''), 'ok', 4500);
    };
  });
}

/* ==============================================================
   21. Menú por artículo
   ============================================================== */

async function articleMenu(slug){
  const r = App.items[slug]; if(!r) return;
  const url = SITE.liveUrlPattern.replace('{slug}', slug);
  const m = openModal(
    '<div class="mh"><h3>' + esc((r.meta && r.meta.title) || slug) + '</h3></div>' +
    '<div class="mb"><div class="inline" style="margin-bottom:14px">' + srcChips(r) + '</div>' +
    '<div class="stack">' +
      '<button class="btn" data-m="edit"><ion-icon name="create-outline"></ion-icon> Editar' + (r.local && r.remote ? ' (carpeta local)' : '') + '</button>' +
      (r.remote ? '<button class="btn" data-m="edit-remote"><ion-icon name="globe-outline"></ion-icon> Editar la versión del repositorio</button>' : '') +
      (r.local && r.remote ? '<button class="btn" data-m="diff"><ion-icon name="git-compare-outline"></ion-icon> Comparar local con el repositorio</button>' : '') +
      '<button class="btn" data-m="open"><ion-icon name="open-outline"></ion-icon> Abrir en el sitio</button>' +
      '<button class="btn" data-m="copy"><ion-icon name="copy-outline"></ion-icon> Copiar el HTML</button>' +
      '<button class="btn" data-m="download"><ion-icon name="download-outline"></ion-icon> Descargar el archivo</button>' +
      '<button class="btn" data-m="dup"><ion-icon name="duplicate-outline"></ion-icon> Duplicar como artículo nuevo</button>' +
      '<button class="btn danger" data-m="del"><ion-icon name="trash-outline"></ion-icon> Eliminar…</button>' +
    '</div>' +
    '<div class="hint" style="margin-top:12px">' + esc(articlePath(slug)) + ' · <a href="' + escAttr(url) + '" target="_blank" rel="noopener">' + esc(url) + '</a></div>' +
    '</div><div class="mf"><button class="btn" data-x="c">Cerrar</button></div>');
  m.querySelector('[data-x=c]').onclick = () => closeModal(null);
  const on = (k, fn) => { const b = m.querySelector('[data-m=' + k + ']'); if(b) b.onclick = fn; };
  on('edit',        () => { closeModal(null); openEditor(slug); });
  on('edit-remote', () => { closeModal(null); openEditor(slug, 'remote'); });
  on('open',        () => { window.open(url, '_blank', 'noopener'); });
  on('copy',   async () => { const h = await getHtml(slug); await copy(h); closeModal(null); toast('HTML copiado', 'ok'); });
  on('download', async () => { const h = await getHtml(slug); download(slug + '.html', h); closeModal(null); });
  on('del',         () => { closeModal(null); doDelete(slug); });
  on('dup',    async () => {
    closeModal(null);
    const h = await getHtml(slug);
    const mm = Article.parse(h);
    mm.slug = ''; mm.title = (mm.title || slug) + ' (copia)'; mm.headline = mm.title;
    mm.datePublished = isoNow(); mm.dateModified = isoNow();
    App.editing = { slug:'', isNew:true, original:null, baseline:null, mode:'rebuild', m:mm, dirty:true, rteTouched:true, tab:'metadatos',
      editorMode:'visual', showPreview:true, device:'desk',
      indexCard:{enabled:S.updateIndex, tag:'', alt:mm.imageAlt||''}, imagePrompt:'', draftId:'draft_'+uid() };
    App.view = 'editor'; render();
    toast('Duplicado. Define un slug nuevo antes de publicar.', 'warn', 5000);
  });
  on('diff', async () => {
    closeModal(null);
    const a = r.local.html;
    let b;
    try{ b = await getHtml(slug, 'remote'); }catch(e){ return toast(e.message, 'err'); }
    const mm = openModal('<div class="mh"><h3>Local vs repositorio — ' + esc(slug) + '</h3></div>' +
      '<div class="mb">' + (a === b ? '<div class="vitem ok"><div class="ic"><ion-icon name="checkmark-circle-outline"></ion-icon></div><div class="tx"><b>Idénticos</b>El archivo local coincide con el del repositorio.</div></div>'
        : '<div class="vitem warn" style="margin-bottom:12px"><div class="ic"><ion-icon name="warning-outline"></ion-icon></div><div class="tx"><b>Hay diferencias</b>' +
          '<code>−</code> repositorio · <code>+</code> carpeta local</div></div>' + renderDiff(b, a)) +
      '</div><div class="mf"><button class="btn" data-x="c">Cerrar</button></div>', {wide:true});
    mm.querySelector('[data-x=c]').onclick = () => closeModal(null);
  });
}

/* ==============================================================
   22. Conexión y eventos
   ============================================================== */

function setConn(state, text){
  const c = $('#connChip');
  c.className = 'conn ' + state;
  $('#connTxt').textContent = text;
}
async function checkConn(){
  if(!S.apiBase || !S.token){ setConn('', 'API sin configurar'); App.serverInfo = null; return; }
  setConn('busy', 'Conectando…');
  try{
    const h = await Api.health();
    App.serverInfo = h;
    if(h.branch) S.baseBranch = h.branch;
    setConn('on', (h.repo || 'API').split('/').pop() + ' · ' + (h.branch || ''));
  }catch(e){
    App.serverInfo = null;
    setConn('off', e.status === 401 ? 'Token rechazado' : 'API sin respuesta');
  }
}

async function connectFolder(){
  if(LocalFs.connected()){
    const opt = await confirmModal({ title:'Carpeta local', ok:'Cambiar de carpeta', cancel:'Mantener',
      html:'<p style="margin:0;font-size:13px;line-height:1.6">Conectada: <code>' + esc(LocalFs.name) + '</code></p>' });
    if(!opt) return;
  }
  if(LocalFs.supported){
    try{
      await LocalFs.connect();
      $('#folderTxt').textContent = LocalFs.name;
      toast('Carpeta conectada: ' + LocalFs.name, 'ok');
      await loadLocal(); render();
      return;
    }catch(e){
      if(e && e.name === 'AbortError') return;   /* el usuario canceló */
      if(e && e.message === 'unsupported'){ /* sigue al respaldo */ }
      else if(e && (e.name === 'SecurityError' || e.name === 'NotAllowedError')){
        /* Algunos navegadores no permiten elegir carpetas cuando la página se
           abre como archivo local. Se cae al selector clásico, en solo lectura. */
        toast('Este navegador no permite escribir en carpetas desde un archivo local. Se abrirá en modo solo lectura.', 'warn', 6500);
      }else{
        toast(e.message || String(e), 'err', 6000);
        return;
      }
    }
  }
  /* respaldo: selector de carpeta clásico, solo lectura */
  const inp = document.createElement('input');
  inp.type = 'file'; inp.webkitdirectory = true; inp.multiple = true; inp.style.display = 'none';
  document.body.appendChild(inp);
  inp.onchange = async () => {
    try{
      await LocalFs.loadFromInput(Array.from(inp.files));
      $('#folderTxt').textContent = LocalFs.name + ' (solo lectura)';
      toast('Carpeta cargada en modo solo lectura', 'warn', 5000);
      await loadLocal(); render();
    }catch(e){ toast(e.message || String(e), 'err', 6000); }
    finally{ inp.remove(); }
  };
  inp.click();
}

/* --- delegación de eventos --- */
document.addEventListener('click', ev => {
  const t = ev.target.closest('[data-act],[data-nav],[data-open],[data-menu],[data-draft],[data-draft-del],[data-ed]');
  if(!t) return;

  if(t.dataset.nav){ App.view = t.dataset.nav; render(); return; }
  if(t.dataset.open){ openEditor(t.dataset.open); return; }
  if(t.dataset.menu){ articleMenu(t.dataset.menu); return; }
  if(t.dataset.draft){ openDraft(t.dataset.draft); return; }
  if(t.dataset.draftDel){ delete App.drafts[t.dataset.draftDel]; saveDrafts(); render(); return; }

  if(t.dataset.ed){
    const e = App.editing;
    switch(t.dataset.ed){
      case 'back':
        if(e && e.dirty){
          confirmModal({title:'Salir del editor', text:'Hay cambios sin guardar. Quedan en Borradores.', ok:'Salir', cancel:'Seguir editando'})
            .then(ok => { if(ok){ syncFromEditor(); autosave(); App.editing = null; App.view='library'; render(); } });
        }else{ App.editing = null; App.view='library'; render(); }
        return;
      case 'save-local': doSaveLocal(); return;
      case 'download':   syncFromEditor(); download((e.m.slug||'articulo') + '.html', currentHtml()); return;
      case 'pr':         doCreatePr(); return;
      case 'publish':    doPublish(false); return;
      case 'delete':     doDelete(e.m.slug); return;
      case 'togglepv':   e.showPreview = !e.showPreview; tabContenido($('#edBody')); return;
      case 'refreshpv':  schedulePreview(true); return;
    }
  }

  switch(t.dataset.act){
    case 'new':         newArticle(); break;
    case 'import':      importModal(); break;
    case 'reload':      reloadAll(); break;
    case 'reload-prs':  loadPrs().then(render); break;
    case 'folder':      connectFolder(); break;
    case 'settings':    openSettings(); break;
    case 'clear-drafts':
      confirmModal({title:'Borrar todos los borradores', text:'No afecta a los artículos guardados ni publicados.', ok:'Borrar', danger:true})
        .then(ok => { if(ok){ App.drafts = {}; saveDrafts(); render(); } });
      break;
  }
});

$('#btnSettings').onclick = () => openSettings();
$('#btnFolder').onclick   = () => connectFolder();
$('#connChip').onclick    = () => openSettings();

document.addEventListener('keydown', e => {
  const inField = /input|textarea|select/i.test((e.target.tagName || '')) || e.target.isContentEditable;
  if((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 's'){ e.preventDefault(); if(App.editing) doSaveLocal(); return; }
  if(inField) return;
  if(e.key === 'n' && !e.metaKey && !e.ctrlKey && App.view !== 'editor'){ newArticle(); }
  if(e.key === '/' && App.view === 'library'){ e.preventDefault(); const q = $('#q'); if(q) q.focus(); }
});

window.addEventListener('beforeunload', e => {
  if(App.editing && App.editing.dirty){ e.preventDefault(); e.returnValue = ''; }
});

/* ==============================================================
   23. Arranque
   ============================================================== */

(async function init(){
  Log.render(); Log.badge();

  /* Ionicons se carga desde unpkg, igual que en right-banner-cta.html del sitio.
     Sin conexión el componente nunca se define: se marca el body para colapsar
     los huecos y que los botones no queden descuadrados. */
  setTimeout(() => {
    if(!customElements.get('ion-icon')) document.body.classList.add('sin-iconos');
  }, 3000);

  if(!Store.ok) toast('El navegador bloquea el almacenamiento local: los ajustes y borradores no se conservarán al cerrar.', 'warn', 8000);
  if(!LocalFs.supported) $('#btnFolder').title = 'Este navegador no permite escribir en carpetas locales: se cargará en modo solo lectura.';
  if(location.protocol === 'file:' && !Store.ok)
    toast('Abre el CMS en Chrome, Edge o Brave: este navegador bloquea el almacenamiento en archivos locales.', 'warn', 9000);

  render();
  try{ if(await LocalFs.restore()){ $('#folderTxt').textContent = LocalFs.name; await loadLocal(true); } }catch(e){ /* sin carpeta recordada */ }
  await checkConn();
  await reloadAll(true);

  /* Si la API respondió pero no hay índice local, se pide al servidor. */
  if(!App.indexHtml && Api.ready()){
    try{
      const f = await Api.file(SITE.indexFile);
      App.indexHtml = f.content; App.indexSource = 'repositorio';
    }catch(e){ /* el índice es opcional: el CMS funciona sin él */ }
  }
  if(!Object.keys(App.includes).length && Api.ready()){
    try{ const inc = await Api.includes(); if(inc && inc.includes) App.includes = inc.includes; }catch(e){ /* la vista previa marca los includes que falten */ }
  }
  render();
})();
</script>
