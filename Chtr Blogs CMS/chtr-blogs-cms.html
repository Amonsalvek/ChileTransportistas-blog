<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CHTR Blog CMS — ChileTransportistas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Exo:wght@400;500;600;700&family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">
<!-- Ionicons: mismo origen y versión que usa el sitio en right-banner-cta.html -->
<script type="module" src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"></script>
<script nomodule src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.js"></script>
<style>
/* ============================================================
   CHTR Blog CMS — estilos
   ============================================================ */
:root{
  --brand:#d50032;
  --brand-dark:#a80028;
  --brand-soft:#fff1f4;
  --ink:#141a21;
  --ink-2:#3d4854;
  --ink-3:#6b7885;
  --line:#e3e8ee;
  --line-2:#eef2f6;
  --bg:#f6f8fa;
  --panel:#ffffff;
  --ok:#0f8f4b;
  --ok-soft:#e8f7ee;
  --warn:#b26a00;
  --warn-soft:#fff5e2;
  --err:#c62828;
  --err-soft:#fdeceb;
  --info:#1565c0;
  --info-soft:#e9f2fd;
  --radius:10px;
  --shadow:0 1px 2px rgba(16,24,40,.05), 0 4px 14px rgba(16,24,40,.06);
  --shadow-lg:0 10px 40px rgba(16,24,40,.16);
  --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace;
  --sans:"Exo",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  --body:"Quicksand",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  --topbar-h:56px;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;background:var(--bg);color:var(--ink);
  font-family:var(--body);font-size:14px;line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3,h4{font-family:var(--sans);margin:0;line-height:1.2}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--brand);text-decoration:none}
a:hover{text-decoration:underline}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:#cdd5de;border-radius:8px;border:2px solid var(--bg)}
::-webkit-scrollbar-thumb:hover{background:#b6c0cb}
::-webkit-scrollbar-track{background:transparent}

/* ---------- iconos ---------- */
ion-icon{
  font-size:16px;               /* Ionicons se dimensiona con font-size */
  vertical-align:-.16em;
  flex:none;
  pointer-events:none;
}
.btn ion-icon{font-size:15px}
.btn.sm ion-icon{font-size:14px}
.side button ion-icon{font-size:17px}
.tabs button ion-icon{font-size:15px}
.toolbar .tb ion-icon{font-size:15px;vertical-align:-.2em}
.vitem .ic ion-icon{font-size:15px}
.mh ion-icon{font-size:19px}
/* Sin conexión el componente no llega a definirse: se colapsa el hueco
   en vez de dejar cajas vacías descuadrando la interfaz. */
body.sin-iconos ion-icon{display:none}

/* ---------- primitivos ---------- */
.btn{
  display:inline-flex;align-items:center;gap:7px;justify-content:center;
  border:1px solid var(--line);background:#fff;color:var(--ink);
  padding:7px 13px;border-radius:8px;cursor:pointer;font-weight:600;font-size:13px;
  transition:background .12s,border-color .12s,box-shadow .12s,transform .05s;
  white-space:nowrap;user-select:none;
}
.btn:hover{background:#f7f9fb;border-color:#cfd8e2}
.btn:active{transform:translateY(1px)}
.btn:disabled{opacity:.5;cursor:not-allowed;transform:none}
.btn.primary{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.primary:hover{background:var(--brand-dark);border-color:var(--brand-dark)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.ghost:hover{background:#eef2f6}
.btn.danger{color:var(--err);border-color:#f3c9c7}
.btn.danger:hover{background:var(--err-soft);border-color:#e8a9a6}
.btn.sm{padding:4px 9px;font-size:12px;border-radius:7px}
.btn.icon{padding:6px;width:30px;height:30px}
.btn .sp{width:13px;height:13px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

.field{display:flex;flex-direction:column;gap:5px;margin-bottom:14px}
.field > label{font-size:12px;font-weight:700;color:var(--ink-2);letter-spacing:.01em}
.field .hint{font-size:11.5px;color:var(--ink-3);line-height:1.45}
.field .hint code{background:var(--line-2);padding:1px 4px;border-radius:4px;font-family:var(--mono);font-size:11px}
input[type=text],input[type=url],input[type=password],input[type=date],input[type=number],select,textarea{
  width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:#fff;
  outline:none;transition:border-color .12s,box-shadow .12s;
}
input:focus,select:focus,textarea:focus{border-color:var(--brand);box-shadow:0 0 0 3px rgba(213,0,50,.10)}
input[readonly]{background:#f7f9fb;color:var(--ink-3)}
textarea{resize:vertical;min-height:70px}
textarea.code{font-family:var(--mono);font-size:12.5px;line-height:1.6;tab-size:2}
.row{display:flex;gap:12px}
.row > *{flex:1;min-width:0}
.checkline{display:flex;align-items:flex-start;gap:8px;margin-bottom:10px;cursor:pointer}
.checkline input{margin-top:2px;accent-color:var(--brand);width:15px;height:15px;flex:none}
.checkline span{font-size:13px}
.checkline small{display:block;color:var(--ink-3);font-size:11.5px;line-height:1.4}

.chip{display:inline-flex;align-items:center;gap:5px;padding:2px 8px;border-radius:999px;font-size:11px;font-weight:700;letter-spacing:.02em}
.chip.ok{background:var(--ok-soft);color:var(--ok)}
.chip.warn{background:var(--warn-soft);color:var(--warn)}
.chip.err{background:var(--err-soft);color:var(--err)}
.chip.info{background:var(--info-soft);color:var(--info)}
.chip.mute{background:var(--line-2);color:var(--ink-3)}
.chip.brand{background:var(--brand-soft);color:var(--brand)}
.dot{width:7px;height:7px;border-radius:50%;background:currentColor;flex:none}

.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin-bottom:14px}
.panel > h3{font-size:14px;margin-bottom:4px}
.panel > .sub{font-size:12px;color:var(--ink-3);margin-bottom:14px}
.sep{height:1px;background:var(--line);margin:16px 0}
.empty{text-align:center;padding:56px 20px;color:var(--ink-3)}
.empty h3{font-size:16px;color:var(--ink-2);margin-bottom:6px}
.empty p{margin:0 auto 16px;max-width:420px;font-size:13px}

/* ---------- topbar ---------- */
.topbar{
  height:var(--topbar-h);display:flex;align-items:center;gap:12px;padding:0 14px;
  background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:60;
}
.brand{display:flex;align-items:center;gap:9px;font-family:var(--sans);font-weight:700;font-size:15px;letter-spacing:-.01em}
.brand .mark{width:26px;height:26px;border-radius:7px;background:var(--brand);color:#fff;display:grid;place-items:center;font-size:12px;font-weight:700}
.brand small{display:block;font-size:10px;color:var(--ink-3);font-weight:600;letter-spacing:.04em;text-transform:uppercase;font-family:var(--body)}
.topbar .spacer{flex:1}
.conn{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:600;color:var(--ink-2);
  padding:4px 10px;border-radius:999px;background:var(--line-2);cursor:pointer;border:1px solid transparent}
.conn:hover{border-color:var(--line)}
.conn .dot{background:#b6c0cb}
.conn.on .dot{background:var(--ok);box-shadow:0 0 0 3px rgba(15,143,75,.15)}
.conn.off .dot{background:var(--err)}
.conn.busy .dot{background:var(--warn);animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.3}}

/* ---------- layout ---------- */
.shell{display:flex;height:calc(100vh - var(--topbar-h));overflow:hidden}
.side{
  width:210px;flex:none;background:#fff;border-right:1px solid var(--line);
  padding:12px 10px;display:flex;flex-direction:column;gap:2px;overflow-y:auto;
}
.side .grp{font-size:10.5px;font-weight:700;color:var(--ink-3);text-transform:uppercase;letter-spacing:.06em;padding:12px 8px 5px}
.side button{
  display:flex;align-items:center;gap:9px;width:100%;text-align:left;padding:7px 9px;border-radius:8px;
  border:none;background:transparent;cursor:pointer;font-size:13px;font-weight:600;color:var(--ink-2)
}
.side button:hover{background:var(--line-2)}
.side button.active{background:var(--brand-soft);color:var(--brand)}
.side button .cnt{margin-left:auto;font-size:11px;font-weight:700;color:var(--ink-3);background:var(--line-2);padding:1px 7px;border-radius:999px}
.side button.active .cnt{background:#fff;color:var(--brand)}
.main{flex:1;overflow-y:auto;min-width:0}
.wrap{max-width:1180px;margin:0 auto;padding:20px}
.page-head{display:flex;align-items:flex-start;gap:14px;margin-bottom:18px;flex-wrap:wrap}
.page-head h1{font-size:20px;margin-bottom:3px}
.page-head p{margin:0;font-size:12.5px;color:var(--ink-3)}
.page-head .acts{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
</style>
<style>
/* ---------- biblioteca ---------- */
.libbar{display:flex;gap:8px;align-items:center;margin-bottom:14px;flex-wrap:wrap}
.search{position:relative;flex:1;min-width:200px;max-width:360px}
.search input{padding-left:31px}
.search svg{position:absolute;left:9px;top:50%;transform:translateY(-50%);opacity:.45;pointer-events:none}
.libbar select{width:auto;min-width:132px}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(292px,1fr));gap:14px}
.acard{
  background:#fff;border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;
  display:flex;flex-direction:column;transition:box-shadow .15s,border-color .15s,transform .12s;
}
.acard:hover{box-shadow:var(--shadow-lg);border-color:#cfd8e2;transform:translateY(-2px)}
.acard .thumb{aspect-ratio:16/9;background:linear-gradient(135deg,#eef2f6,#e3e8ee);position:relative;overflow:hidden}
.acard .thumb img{width:100%;height:100%;object-fit:cover;display:block}
.acard .thumb .ph{position:absolute;inset:0;display:grid;place-items:center;color:#b6c0cb;font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase}
.acard .badges{position:absolute;top:8px;left:8px;display:flex;gap:5px;flex-wrap:wrap;max-width:calc(100% - 16px)}
.acard .body{padding:12px 13px;flex:1;display:flex;flex-direction:column;gap:6px}
.acard h3{font-size:14px;line-height:1.3;font-family:var(--sans);
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.acard .slug{font-family:var(--mono);font-size:11px;color:var(--ink-3);word-break:break-all}
.acard .desc{font-size:12px;color:var(--ink-3);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.acard .foot{margin-top:auto;padding-top:9px;display:flex;gap:6px;align-items:center;border-top:1px solid var(--line-2)}
.acard .foot .when{font-size:11px;color:var(--ink-3);margin-right:auto}

table.list{width:100%;border-collapse:collapse;background:#fff;border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
table.list th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-3);
  padding:9px 12px;border-bottom:1px solid var(--line);background:#fafbfc;font-weight:700}
table.list td{padding:10px 12px;border-bottom:1px solid var(--line-2);vertical-align:middle;font-size:13px}
table.list tr:last-child td{border-bottom:none}
table.list tr:hover td{background:#fafbfc}
table.list .t{font-weight:600}
table.list .s{font-family:var(--mono);font-size:11px;color:var(--ink-3)}
table.list td.acts{text-align:right;white-space:nowrap}

/* ---------- editor ---------- */
.ed{display:flex;flex-direction:column;height:calc(100vh - var(--topbar-h))}
.ed-head{
  display:flex;align-items:center;gap:10px;padding:10px 16px;background:#fff;border-bottom:1px solid var(--line);flex:none;flex-wrap:wrap
}
.ed-head .ttl{min-width:0;flex:1}
.ed-head .ttl h2{font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ed-head .ttl .m{font-size:11.5px;color:var(--ink-3);font-family:var(--mono);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ed-head .acts{display:flex;gap:7px;align-items:center;flex-wrap:wrap}
.tabs{display:flex;gap:2px;padding:0 16px;background:#fff;border-bottom:1px solid var(--line);flex:none;overflow-x:auto}
.tabs button{
  border:none;background:transparent;padding:9px 12px;font-size:13px;font-weight:600;color:var(--ink-3);
  cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap;display:flex;align-items:center;gap:6px
}
.tabs button:hover{color:var(--ink)}
.tabs button.active{color:var(--brand);border-bottom-color:var(--brand)}
.tabs button .n{background:var(--err);color:#fff;border-radius:999px;font-size:10px;padding:0 5px;font-weight:700}
.ed-body{flex:1;overflow:hidden;position:relative}
.pane{position:absolute;inset:0;overflow-y:auto;display:none}
.pane.active{display:block}
.pane-inner{max-width:920px;margin:0 auto;padding:18px}
.pane-wide{max-width:1180px}

/* editor de contenido */
.ed-split{display:flex;height:100%;overflow:hidden}
.ed-col{flex:1;min-width:0;display:flex;flex-direction:column;overflow:hidden}
.ed-col + .ed-col{border-left:1px solid var(--line)}
.ed-col .colhead{display:flex;align-items:center;gap:6px;padding:7px 12px;background:#fafbfc;border-bottom:1px solid var(--line);flex:none}
.ed-col .colhead .lb{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-3);margin-right:auto}
.toolbar{display:flex;gap:3px;padding:6px 10px;background:#fff;border-bottom:1px solid var(--line);flex-wrap:wrap;flex:none;align-items:center}
.toolbar .tb{
  border:1px solid transparent;background:transparent;border-radius:6px;padding:4px 8px;cursor:pointer;
  font-size:12px;font-weight:700;color:var(--ink-2);min-width:28px;height:27px;display:inline-flex;align-items:center;justify-content:center;gap:4px
}
.toolbar .tb:hover{background:var(--line-2)}
.toolbar .tb.on{background:var(--brand-soft);color:var(--brand)}
.toolbar .div{width:1px;height:18px;background:var(--line);margin:0 3px}
.rte{
  flex:1;overflow-y:auto;padding:22px 26px;background:#fff;outline:none;
  font-family:var(--body);font-size:15px;line-height:1.7;color:#333;
}
.rte:focus{outline:none}
.rte h1{font-family:var(--sans);font-size:1.9rem;margin:0 0 .6em}
.rte h2{font-family:var(--sans);font-size:1.42rem;margin:1.3em 0 .5em}
.rte h3{font-family:var(--sans);font-size:1.12rem;margin:1.2em 0 .45em}
.rte p{margin:0 0 1em}
.rte ul,.rte ol{margin:0 0 1em;padding-left:1.5em}
.rte li{margin-bottom:.35em}
.rte a{color:var(--brand);text-decoration:underline}
.rte img{max-width:100%;height:auto;display:block;margin:10px auto;border-radius:6px}
.rte figure{margin:1.4em 0}
.rte figcaption{font-size:12px;color:var(--ink-3);text-align:center;margin-top:6px}
.rte blockquote{margin:1.2em 0;padding:8px 16px;border-left:3px solid var(--brand);background:var(--brand-soft);color:var(--ink-2)}
.rte table{width:100%;border-collapse:collapse;margin:1.2em 0;font-size:13px}
.rte th,.rte td{border:1px solid var(--line);padding:7px 10px;text-align:left}
.rte th{background:#fafbfc;font-weight:700}
.rte .linea{border:1px solid lightgray;margin:20px 0;height:1px;width:100%}
.rte .ssi-chip{
  display:flex;align-items:center;gap:8px;margin:1.4em 0;padding:9px 12px;border-radius:8px;
  background:repeating-linear-gradient(45deg,#f4f7fa,#f4f7fa 8px,#eef2f6 8px,#eef2f6 16px);
  border:1px dashed #b9c4d0;font-family:var(--mono);font-size:11.5px;color:var(--ink-2);user-select:none;
}
.rte .ssi-chip::before{content:"SSI";background:var(--ink-2);color:#fff;font-size:9px;font-weight:700;padding:2px 6px;border-radius:4px;letter-spacing:.06em}
.rte .ssi-chip .x{margin-left:auto;cursor:pointer;color:var(--err);font-weight:700;padding:0 4px}
.rte .raw-chip{
  display:block;margin:1.4em 0;padding:9px 12px;border-radius:8px;background:#fbfcfd;border:1px dashed #cfd8e2;
  font-family:var(--mono);font-size:11.5px;color:var(--ink-3);white-space:pre-wrap;word-break:break-all;user-select:none
}
.codewrap{flex:1;display:flex;min-height:0;background:#fff}
.codewrap textarea{flex:1;border:none;border-radius:0;padding:14px 16px;resize:none;min-height:0}
.codewrap textarea:focus{box-shadow:none;border:none}

/* vista previa */
.pv{height:100%;display:flex;flex-direction:column;background:#fff}
.pv .bar{display:flex;align-items:center;gap:8px;padding:7px 12px;border-bottom:1px solid var(--line);background:#fafbfc;flex:none}
.pv iframe{flex:1;border:none;width:100%;background:#fff}
.pv .w-desk{max-width:100%}
.pv .w-tab{max-width:820px;margin:0 auto;border-left:1px solid var(--line);border-right:1px solid var(--line)}
.pv .w-mob{max-width:400px;margin:0 auto;border-left:1px solid var(--line);border-right:1px solid var(--line)}

/* validación */
.vlist{display:flex;flex-direction:column;gap:8px}
.vitem{display:flex;gap:10px;padding:10px 12px;border-radius:8px;border:1px solid var(--line);background:#fff;align-items:flex-start}
.vitem.err{border-color:#f3c9c7;background:var(--err-soft)}
.vitem.warn{border-color:#f0d9a8;background:var(--warn-soft)}
.vitem.ok{border-color:#c6e8d3;background:var(--ok-soft)}
.vitem .ic{font-weight:700;font-size:13px;flex:none;width:16px;text-align:center}
.vitem .tx{font-size:12.5px;line-height:1.5}
.vitem .tx b{display:block;font-size:13px;margin-bottom:1px}
.vitem code{font-family:var(--mono);font-size:11.5px;background:rgba(0,0,0,.05);padding:1px 4px;border-radius:4px}
</style>
<style>
/* ---------- actividad (drawer) ---------- */
.drawer{
  position:fixed;top:0;right:0;bottom:0;width:430px;max-width:94vw;background:#fff;z-index:90;
  border-left:1px solid var(--line);box-shadow:var(--shadow-lg);display:flex;flex-direction:column;
  transform:translateX(100%);transition:transform .22s cubic-bezier(.4,0,.2,1);
}
.drawer.open{transform:none}
.drawer .dh{display:flex;align-items:center;gap:8px;padding:12px 14px;border-bottom:1px solid var(--line);flex:none}
.drawer .dh h3{font-size:14px;margin-right:auto}
.drawer .db{flex:1;overflow-y:auto;padding:10px}
.logi{border:1px solid var(--line);border-radius:9px;margin-bottom:8px;overflow:hidden;background:#fff}
.logi .lh{display:flex;gap:8px;align-items:center;padding:9px 11px;cursor:pointer}
.logi .lh:hover{background:#fafbfc}
.logi .lh .ttl{flex:1;min-width:0}
.logi .lh .ttl b{display:block;font-size:12.5px;font-weight:700}
.logi .lh .ttl span{font-size:11px;color:var(--ink-3);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.logi .lb{display:none;padding:0 11px 11px;border-top:1px solid var(--line-2)}
.logi.open .lb{display:block}
.logi pre{
  background:#f7f9fb;border:1px solid var(--line-2);border-radius:7px;padding:9px;margin:8px 0 0;
  font-family:var(--mono);font-size:11px;line-height:1.55;max-height:230px;overflow:auto;white-space:pre-wrap;word-break:break-word
}
.logi .lb .lnk{display:inline-flex;align-items:center;gap:5px;margin-top:9px;font-size:12px;font-weight:700}
.spinner{width:13px;height:13px;border:2px solid var(--warn);border-right-color:transparent;border-radius:50%;animation:spin .7s linear infinite;flex:none}

/* ---------- modal ---------- */
.ovl{position:fixed;inset:0;background:rgba(16,24,40,.42);z-index:100;display:none;align-items:flex-start;justify-content:center;padding:6vh 16px;overflow-y:auto}
.ovl.open{display:flex}
.modal{background:#fff;border-radius:12px;box-shadow:var(--shadow-lg);width:100%;max-width:600px;max-height:88vh;display:flex;flex-direction:column;animation:pop .16s ease}
.modal.wide{max-width:840px}
@keyframes pop{from{opacity:0;transform:translateY(-8px) scale(.985)}}
.modal .mh{display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--line);flex:none}
.modal .mh h3{font-size:15px;margin-right:auto}
.modal .mb{padding:18px;overflow-y:auto;flex:1}

<script>
/* ==============================================================

'use strict';

/* CSS real del sitio (assets/css/styles.css) — embebido para que la vista

/* Plantilla exacta del documento de artículo, con el mismo espaciado
   (incluye los tabs literales) que los artículos ya publicados. */

/* ---------------- 2. Utilidades ---------------- */

const $  = (s, r) => (r || document).querySelector(s);
const $$ = (s, r) => Array.from((r || document).querySelectorAll(s));

function esc(s){
  return String(s == null ? '' : s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}
function escAttr(s){ return String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/"/g,'&quot;'); }
function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2, 8); }

/** Slug según las reglas de blogs-api.md: minúsculas, sin tildes, sin ñ, a-z0-9- */
function slugify(str){
  return String(str || '')
    .normalize('NFD').replace(/[\u0300-\u036f]/g,'')
    .replace(/ñ/gi,'n').replace(/[¿?¡!“”"'‘’.,;:()\[\]{}]/g,'')
    .toLowerCase().trim()
    .replace(/[^a-z0-9]+/g,'-')
    .replace(/^-+|-+$/g,'')
    .replace(/-{2,}/g,'-');
}
function validSlug(s){ return /^[a-z0-9]+(?:-[a-z0-9]+)*$/.test(String(s || '')); }

function fmtDate(iso){
  if(!iso) return '—';
  const d = new Date(iso);
  if(isNaN(d)) return String(iso).slice(0,10);
  return d.toLocaleDateString('es-CL',{day:'2-digit',month:'short',year:'numeric'});
}
function fmtTime(ts){
  const d = new Date(ts);
  return d.toLocaleTimeString('es-CL',{hour:'2-digit',minute:'2-digit',second:'2-digit'});
}
function isoNow(){ return new Date().toISOString().replace(/\.\d{3}Z$/,'+00:00'); }
function toIsoUtc(dateStr){
  if(!dateStr) return isoNow();
  if(/T/.test(dateStr)) return dateStr;
  return dateStr + 'T12:00:00+00:00';
}
function dateInputValue(iso){
  if(!iso) return '';
  const m = String(iso).match(/^(\d{4}-\d{2}-\d{2})/);
  return m ? m[1] : '';
}
function bytes(n){
  if(n == null) return '—';
  if(n < 1024) return n + ' B';
  if(n < 1024*1024) return (n/1024).toFixed(1) + ' KB';
  return (n/1048576).toFixed(2) + ' MB';
}
function debounce(fn, ms){
  let t; return function(){ const a = arguments, c = this; clearTimeout(t); t = setTimeout(()=>fn.apply(c,a), ms); };
}
function stripTags(html){
  const d = document.createElement('div'); d.innerHTML = String(html || ''); return (d.textContent || '').replace(/\s+/g,' ').trim();
}
function wordCount(html){ const t = stripTags(html); return t ? t.split(/\s+/).length : 0; }
function readMinutes(html){ return Math.max(1, Math.round(wordCount(html) / 200)); }
/* document.execCommand está obsoleta, pero sigue siendo la única API de edición
   enriquecida disponible sin dependencias: no existe reemplazo estándar para
   insertHTML ni formatBlock. Se concentra aquí para tener un solo punto de
   contacto con ella, y no repartida por todo el editor. */
function execCmd(cmd, arg){
  try{ return document.execCommand(cmd, false, arg); }
  catch(e){ return false; }
}

function copy(text){
  if(navigator.clipboard && window.isSecureContext) return navigator.clipboard.writeText(text);
  const ta = document.createElement('textarea');
  ta.value = text; ta.style.position='fixed'; ta.style.opacity='0';
  document.body.appendChild(ta); ta.select();
  try{ execCmd('copy'); } finally { ta.remove(); }
  return Promise.resolve();
}
function download(name, content, type){
  const blob = new Blob([content], {type: type || 'text/html;charset=utf-8'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click();
  setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); }, 1500);
}
</script>
<script>
/* ---------------- 3. Almacenamiento local ---------------- */

const LS_PREFIX = 'chtr_cms_';
const Store = {
  ok: (function(){ try{ localStorage.setItem('__t','1'); localStorage.removeItem('__t'); return true; }catch(e){ return false; } })(),
  mem: {},
  get(key, def){
    try{
      const raw = this.ok ? localStorage.getItem(LS_PREFIX + key) : this.mem[key];
      return raw == null ? def : JSON.parse(raw);
    }catch(e){ return def; }
  },
  set(key, val){
    const raw = JSON.stringify(val);
    try{ if(this.ok) localStorage.setItem(LS_PREFIX + key, raw); else this.mem[key] = raw; }
    catch(e){ this.mem[key] = raw; }
  },
  del(key){ try{ if(this.ok) localStorage.removeItem(LS_PREFIX + key); }catch(e){ /* almacenamiento bloqueado */ } delete this.mem[key]; }
};

const DEFAULT_SETTINGS = {
  apiBase          : 'https://blog.chiletransportistas.com',
  token            : '',
  rememberToken    : true,
  repo             : SITE.repoDefault,
  baseBranch       : 'main',
  author           : SITE.authorDefault,
  canonicalMode    : 'www',
  canonicalCustom  : '',
  cdnPattern       : SITE.cdnPattern,
  updateIndex      : true,
  autoPublish      : false,
  prReviewers      : '',
  prLabels         : 'cms',
  view             : 'grid'
};

let S = Object.assign({}, DEFAULT_SETTINGS, Store.get('settings', {}));
if(!S.rememberToken) S.token = Store.get('sessionToken', '') || '';

function saveSettings(){
  const copyS = Object.assign({}, S);
  if(!S.rememberToken) copyS.token = '';
  Store.set('settings', copyS);
  if(!S.rememberToken) Store.set('sessionToken', S.token);
}

/* ---------------- 4. Toasts y modales ---------------- */

function toast(msg, kind, ms){
  const el = document.createElement('div');
  el.className = 'toast ' + (kind || '');
  el.innerHTML = (kind === 'ok' ? '<ion-icon name="checkmark-circle-outline"></ion-icon> ' : kind === 'err' ? '<ion-icon name="close-circle-outline"></ion-icon> ' : kind === 'warn' ? '<ion-icon name="warning-outline"></ion-icon> ' : '') + esc(msg);
  $('#toasts').appendChild(el);
  setTimeout(()=>{ el.style.opacity='0'; el.style.transition='opacity .25s'; setTimeout(()=>el.remove(),260); }, ms || 3200);
}

let modalResolve = null;
function openModal(html, opts){
  opts = opts || {};
  const m = $('#modal');
  m.className = 'modal' + (opts.wide ? ' wide' : '');
  m.innerHTML = html;
  $('#ovl').classList.add('open');
  const first = m.querySelector('[data-autofocus]');
  if(first) setTimeout(()=>first.focus(), 40);
  return m;
}
function closeModal(val){
  $('#ovl').classList.remove('open');
  $('#modal').innerHTML = '';
  if(modalResolve){ const r = modalResolve; modalResolve = null; r(val); }
}
$('#ovl').addEventListener('mousedown', e => { if(e.target.id === 'ovl') closeModal(null); });
document.addEventListener('keydown', e => {
  if(e.key === 'Escape' && $('#ovl').classList.contains('open')) closeModal(null);
});

/** Recoge los valores de los campos con id dentro de un modal antes de cerrarlo. */
function collectFields(root){
  const v = {};
  Array.from(root.querySelectorAll('input[id],textarea[id],select[id]')).forEach(el => {
    v[el.id] = (el.type === 'checkbox' || el.type === 'radio') ? el.checked : el.value;
  });
  return { ok:true, v };
}

function confirmModal(opts){
  return new Promise(res => {
    modalResolve = res;
    const m = openModal(
      '<div class="mh"><h3>' + esc(opts.title) + '</h3></div>' +
      '<div class="mb">' + (opts.html || ('<p style="margin:0;font-size:13px;line-height:1.6">' + esc(opts.text || '') + '</p>')) + '</div>' +
      '<div class="mf">' +
        '<button class="btn" data-x="cancel">' + esc(opts.cancel || 'Cancelar') + '</button>' +
        '<button class="btn ' + (opts.danger ? 'danger' : 'primary') + '" data-x="ok" data-autofocus>' + esc(opts.ok || 'Confirmar') + '</button>' +
      '</div>'
    );
    m.querySelector('[data-x=cancel]').onclick = ()=>closeModal(false);
    m.querySelector('[data-x=ok]').onclick    = ()=>closeModal(collectFields(m));
  });
}
function promptModal(opts){
  return new Promise(res => {
    modalResolve = res;
    const m = openModal(
      '<div class="mh"><h3>' + esc(opts.title) + '</h3></div>' +
      '<div class="mb"><div class="field">' +
        (opts.label ? '<label>' + esc(opts.label) + '</label>' : '') +
        (opts.multiline
          ? '<textarea id="pmv" class="code" rows="' + (opts.rows || 10) + '" data-autofocus>' + esc(opts.value || '') + '</textarea>'
          : '<input type="text" id="pmv" value="' + escAttr(opts.value || '') + '" data-autofocus>') +
        (opts.hint ? '<div class="hint">' + opts.hint + '</div>' : '') +
      '</div></div>' +
      '<div class="mf"><button class="btn" data-x="cancel">Cancelar</button>' +
      '<button class="btn primary" data-x="ok">' + esc(opts.ok || 'Aceptar') + '</button></div>'
    , {wide: !!opts.multiline});
    m.querySelector('[data-x=cancel]').onclick = ()=>closeModal(null);
    m.querySelector('[data-x=ok]').onclick    = ()=>closeModal(m.querySelector('#pmv').value);
    if(!opts.multiline){
      m.querySelector('#pmv').addEventListener('keydown', e => { if(e.key==='Enter') closeModal(m.querySelector('#pmv').value); });
    }
  });
}

/* ---------------- 5. Registro de actividad ---------------- */

const Log = {
  items: Store.get('log', []),
  save(){ Store.set('log', this.items.slice(0, 120)); },
  start(action, target, detail){
    const it = { id: uid(), action, target, status:'pending', ts: Date.now(), detail: detail || null, result: null };
    this.items.unshift(it); this.save(); this.render(); this.badge();
    return it.id;
  },
  finish(id, status, result){
    const it = this.items.find(x => x.id === id);
    if(!it) return;
    it.status = status; it.result = result || null; it.done = Date.now();
    this.save(); this.render(); this.badge();
  },
  add(action, target, status, result){
    const id = this.start(action, target); this.finish(id, status, result); return id;
  },
  clear(){ this.items = []; this.save(); this.render(); this.badge(); },
  badge(){
    const p = this.items.filter(x => x.status === 'pending').length;
    const b = $('#actCount');
    if(p){ b.style.display=''; b.textContent = p; b.className = 'chip warn'; }
    else {
      const recentErr = this.items.slice(0,6).filter(x => x.status === 'error').length;
      if(recentErr){ b.style.display=''; b.textContent = recentErr; b.className = 'chip err'; }
      else b.style.display='none';
    }
  },
  render(){
    const box = $('#logBody');
    if(!this.items.length){
      box.innerHTML = '<div class="empty"><h3>Sin actividad</h3><p>Las operaciones (publicar, crear PR, guardar) aparecen aquí con su estado y respuesta.</p></div>';
      return;
    }
    box.innerHTML = this.items.map(it => {
      const chip = it.status === 'pending' ? '<span class="spinner"></span>'
        : it.status === 'ok'    ? '<span class="chip ok"><span class="dot"></span>OK</span>'
        : it.status === 'error' ? '<span class="chip err"><span class="dot"></span>Error</span>'
        : '<span class="chip mute">' + esc(it.status) + '</span>';
      const dur = it.done ? ' · ' + ((it.done - it.ts)/1000).toFixed(1) + 's' : '';
      let detail = '';
      if(it.detail)  detail += '<pre>' + esc(typeof it.detail === 'string' ? it.detail : JSON.stringify(it.detail, null, 2)) + '</pre>';
      if(it.result)  detail += '<pre>' + esc(typeof it.result === 'string' ? it.result : JSON.stringify(it.result, null, 2)) + '</pre>';
      const url = it.result && (it.result.prUrl || it.result.articleUrl || it.result.html_url);
      if(url) detail += '<a class="lnk" href="' + escAttr(url) + '" target="_blank" rel="noopener"><ion-icon name="open-outline"></ion-icon> Abrir ' + (it.result.prUrl ? 'pull request' : 'artículo') + '</a>';
      return '<div class="logi" data-id="' + it.id + '">' +
        '<div class="lh"><div class="ttl"><b>' + esc(it.action) + '</b><span>' + esc(it.target || '') + '</span></div>' +
        '<div style="text-align:right"><div>' + chip + '</div>' +
        '<div style="font-size:10.5px;color:var(--ink-3);margin-top:2px">' + fmtTime(it.ts) + dur + '</div></div></div>' +
        (detail ? '<div class="lb">' + detail + '</div>' : '') +
      '</div>';
    }).join('');
    $$('.logi .lh', box).forEach(h => h.onclick = () => h.parentElement.classList.toggle('open'));
  }
};

$('#btnActivity').onclick    = () => { $('#drawer').classList.toggle('open'); Log.render(); };
$('#btnCloseDrawer').onclick = () => $('#drawer').classList.remove('open');
$('#btnClearLog').onclick    = async () => { if(await confirmModal({title:'Limpiar actividad', text:'Se borra el historial local de operaciones. No afecta a los artículos ni a los pull requests.', ok:'Limpiar', danger:true})) Log.clear(); };

<script>
/* ==============================================================
   6. Modelo de artículo: parseo, construcción y edición quirúrgica
   --------------------------------------------------------------
   Regla de oro: para LEER usamos DOMParser; para ESCRIBIR hacemos
   reemplazos sobre el texto original. Los artículos del sitio no
   tienen etiqueta <body> de apertura y llevan directivas SSI en
   forma de comentarios: un round-trip por el DOM las movería de
   lugar. Editando el string original nada más se mueve.
   ============================================================== */

const ATTRS = '(?:[^>"\']|"[^"]*"|\'[^\']*\')*';
function reEsc(s){ return String(s).replace(/[.*+?^${}()|[\]\\]/g, '\\$&'); }
function escText(s){ return String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function jsonStr(s){ return JSON.stringify(String(s == null ? '' : s)).slice(1,-1); }

const Article = {

  /* ---- plantilla vacía ---- */
  blank(){
    return {
      slug:'', title:'', description:'', image:'', imageAlt:'',
      canonical:'', headline:'', author: S.author, publisher: SITE.publisher,
      publisherLogo: SITE.publisherLogo, favicon: SITE.favicon, ahrefs: SITE.ahrefsKey,
      datePublished: isoNow(), dateModified: isoNow(),
      body:'', headExtra:'', tail:'', extraJsonLd:[],
      htmlOpen:'<html lang="es">', leading:''
    };
  },

  /* ---- parseo ---- */
  parse(raw){
    const m = this.blank();
    m.raw = raw;

    const lead = raw.match(/^([\s\S]*?)<!DOCTYPE/i);
    m.leading = lead ? lead[1] : '';

    const htmlTag = raw.match(new RegExp('<html' + ATTRS + '>', 'i'));
    if(htmlTag) m.htmlOpen = htmlTag[0];

    let doc = null;
    try{ doc = new DOMParser().parseFromString(raw, 'text/html'); }catch(e){ /* se sigue con el análisis por texto */ }

    if(doc){
      const t = doc.querySelector('title');
      m.title = t ? t.textContent.trim() : '';
      const gm = (sel) => { const e = doc.querySelector(sel); return e ? (e.getAttribute('content') || '').trim() : ''; };
      m.description = gm('meta[name="description"]') || gm('meta[property="og:description"]');
      m.image       = gm('meta[property="og:image"]') || gm('meta[name="twitter:image"]');
      const can     = doc.querySelector('link[rel="canonical"]');
      m.canonical   = can ? (can.getAttribute('href') || '').trim() : gm('meta[property="og:url"]');
      const img     = doc.querySelector('article img');
      m.imageAlt    = img ? (img.getAttribute('alt') || '') : '';
    }

    /* JSON-LD */
    const ldRe = new RegExp('\x3Cscript' + ATTRS + 'type\\s*=\\s*["\']application/ld\\+json["\']' + ATTRS + '>([\\s\\S]*?)<\\/script>', 'gi');
    let mt;
    while((mt = ldRe.exec(raw)) !== null){
      let obj = null;
      try{ obj = JSON.parse(mt[1]); }catch(e){ obj = null; }
      if(obj && obj['@type'] === 'BlogPosting'){
        m.jsonldRaw       = mt[0];
        m.jsonldIndex     = mt.index;
        m.jsonld          = obj;
        m.headline        = obj.headline || '';
        m.author          = (obj.author && obj.author.name) || m.author;
        m.publisher       = (obj.publisher && obj.publisher.name) || m.publisher;
        m.publisherLogo   = (obj.publisher && obj.publisher.logo && obj.publisher.logo.url) || m.publisherLogo;
        m.datePublished   = obj.datePublished || m.datePublished;
        m.dateModified    = obj.dateModified  || m.dateModified;
        if(!m.description) m.description = obj.description || '';
      }else if(mt[0]){
        m.extraJsonLd.push({ raw: mt[0], parsed: obj, type: obj && obj['@type'] });
      }
    }
    if(!m.headline) m.headline = m.title;

    /* favicon / clave de ahrefs (se conservan tal cual) */
    const fav = raw.match(new RegExp('<link' + ATTRS + 'rel\\s*=\\s*["\']icon["\']' + ATTRS + '>', 'i'));
    if(fav){ const h = fav[0].match(/href\s*=\s*"([^"]*)"/i); if(h) m.favicon = h[1]; }
    const ah = raw.match(/data-key\s*=\s*"([^"]*)"/i);
    if(ah) m.ahrefs = ah[1];

    /* cuerpo del <article> — extraído del texto crudo para no perder SSI */
    m.body = this.getBody(raw);

    /* extras del <head>: todo lo que va entre el JSON-LD principal y el CSS del sitio */
    m.headExtra = this.getHeadExtra(raw, m);

    /* cola: lo que va entre el include del footer y </body> */
    m.tail = this.getTail(raw);

    /* SSI presentes */
    m.ssi = this.ssiList(raw);

    return m;
  },

  getBody(raw){
    const open = raw.search(new RegExp('<article' + ATTRS + '>', 'i'));
    if(open < 0) return '';
    const openTag = raw.slice(open).match(new RegExp('^<article' + ATTRS + '>', 'i'));
    const close = raw.lastIndexOf('</article>');
    if(close < 0) return '';
    return raw.slice(open + openTag[0].length, close).replace(/^\n/, '').replace(/\s+$/,'');
  },

  getHeadExtra(raw, m){
    const cssIdx = raw.indexOf('<link rel="stylesheet" href="/assets/css/styles.css">');
    const endIdx = cssIdx >= 0 ? cssIdx : raw.search(/<\/head>/i);
    if(endIdx < 0) return '';
    let startIdx;
    if(m.jsonldRaw != null && m.jsonldIndex != null && m.jsonldIndex < endIdx){
      startIdx = m.jsonldIndex + m.jsonldRaw.length;
    }else{
      const u = raw.search(new RegExp('<meta' + ATTRS + 'name\\s*=\\s*["\']twitter:url["\']' + ATTRS + '>', 'i'));
      startIdx = u >= 0 ? raw.indexOf('>', u) + 1 : -1;
    }
    if(startIdx < 0 || startIdx >= endIdx) return '';
    return raw.slice(startIdx, endIdx).replace(/^\n/,'').replace(/[ \t]*\n[ \t]*$/,'').replace(/\s+$/,'');
  },

  getTail(raw){
    const f = raw.indexOf('\x3C!--#include file="/footer.html" -->');
    if(f < 0) return '';
    const start = f + '\x3C!--#include file="/footer.html" -->'.length;
    const end = raw.search(/<\/body>/i);
    if(end < 0 || end <= start) return '';
    return raw.slice(start, end).replace(/^\s*\n/,'').replace(/\s+$/,'');
  },

  ssiList(raw){
    const out = [];
    const re = /\x3C!--#include\s+(file|virtual)\s*=\s*"([^"]+)"\s*-->/g;
    let m;
    while((m = re.exec(raw)) !== null) out.push({ kind: m[1], path: m[2], index: m.index, raw: m[0] });
    return out;
  },

  /* ---- construcción desde plantilla (artículos nuevos o "reconstruir") ---- */
  build(m){
    let out = ARTICLE_TEMPLATE
      .replace(/\{\{TITLE\}\}/g,          escText(m.title))
      .replace(/\{\{FAVICON\}\}/g,        escAttr(m.favicon || SITE.favicon))
      .replace(/\{\{IMAGE\}\}/g,          escAttr(m.image))
      .replace(/\{\{DESC\}\}/g,           escAttr(m.description))
      .replace(/\{\{CANONICAL\}\}/g,      escAttr(m.canonical))
      .replace(/\{\{HEADLINE\}\}/g,       jsonStr(m.headline || m.title))
      .replace(/\{\{AUTHOR\}\}/g,         jsonStr(m.author || SITE.authorDefault))
      .replace(/\{\{PUBLISHER\}\}/g,      jsonStr(m.publisher || SITE.publisher))
      .replace(/\{\{PUBLISHER_LOGO\}\}/g, escAttr(m.publisherLogo || SITE.publisherLogo))
      .replace(/\{\{PUBLISHED\}\}/g,      jsonStr(m.datePublished))
      .replace(/\{\{MODIFIED\}\}/g,       jsonStr(m.dateModified))
      .replace(/\{\{AHREFS\}\}/g,         escAttr(m.ahrefs || SITE.ahrefsKey))
      .replace(/\{\{HEAD_EXTRA\}\}/g,     m.headExtra || '')
      .replace(/\{\{BODY\}\}/g,           m.body || '')
      .replace(/\{\{TAIL\}\}/g,           m.tail ? '\n' + m.tail : '');
    if(m.htmlOpen && m.htmlOpen !== '<html lang="es">') out = out.replace('<html lang="es">', m.htmlOpen);
    return (m.leading || '') + out;
  },

  /* ---- edición quirúrgica sobre el documento original ----
     Solo se reescribe lo que el usuario cambió respecto del archivo tal
     como estaba al abrirlo. Si no cambió nada, devuelve el original byte
     a byte. `base` es el modelo parseado en el momento de abrir. */
  apply(raw, m, base){
    base = base || this.parse(raw);
    let out = raw;
    const rep = [];
    const ch = (k) => String(m[k] == null ? '' : m[k]) !== String(base[k] == null ? '' : base[k]);

    /* título */
    if(ch('title')){
      out = out.replace(/\x3Ctitle>[\s\S]*?\x3C\/title>/i, '\x3Ctitle>' + escText(m.title) + '\x3C/title>');
      rep.push('título');
    }

    /* metadatos, agrupados por el campo del que dependen */
    const groups = [
      ['title',       [['name','twitter:title'], ['property','og:title']]],
      ['description', [['name','description'], ['name','twitter:description'], ['property','og:description']]],
      ['image',       [['property','og:image'], ['name','twitter:image']]],
      ['canonical',   [['property','og:url'], ['name','twitter:url']]]
    ];
    groups.forEach(function(g){
      const key = g[0];
      if(!ch(key)) return;
      g[1].forEach(function(pair){
        const r = setMetaContent(out, pair[0], pair[1], m[key]);
        if(r.found){ out = r.out; if(r.changed) rep.push(pair[1]); }
      });
    });

    /* canonical */
    if(ch('canonical')){
      const cre = new RegExp('\x3Clink' + ATTRS + 'rel\\s*=\\s*["\']canonical["\']' + ATTRS + '>', 'i');
      const cm = out.match(cre);
      if(cm){
        const nt = cm[0].replace(/href\s*=\s*"[^"]*"/i, 'href="' + escAttr(m.canonical) + '"');
        out = out.slice(0, cm.index) + nt + out.slice(cm.index + cm[0].length);
        rep.push('canonical');
      }
    }

    /* JSON-LD BlogPosting: se mutan solo las claves cuyo campo cambió */
    const ldKeys = ['headline','image','description','datePublished','dateModified','author','canonical','title'];
    if(base.jsonldRaw && ldKeys.some(ch)){
      const obj = JSON.parse(JSON.stringify(base.jsonld));
      if(ch('headline'))                                        obj.headline = m.headline || m.title;
      else if(ch('title') && base.headline === base.title)      obj.headline = m.title;
      if(ch('image'))         obj.image = m.image;
      if(ch('description'))   obj.description = m.description;
      if(ch('datePublished')) obj.datePublished = m.datePublished;
      if(ch('dateModified'))  obj.dateModified = m.dateModified;
      if(ch('author'))        obj.author = Object.assign({'@type':'Person'}, obj.author || {}, {name: m.author});
      if(ch('canonical') && obj.mainEntityOfPage) obj.mainEntityOfPage['@id'] = m.canonical;
      const block = '\x3Cscript type="application/ld+json">\n      ' +
        JSON.stringify(obj, null, 2).split('\n').join('\n      ') + '\n      \x3C/script>';
      if(block !== base.jsonldRaw){
        const at = out.indexOf(base.jsonldRaw);
        if(at >= 0){ out = out.slice(0, at) + block + out.slice(at + base.jsonldRaw.length); rep.push('json-ld'); }
      }
    }

    /* extras del head y scripts finales: solo si el usuario los editó */
    if(ch('headExtra') && base.headExtra){
      const at = out.indexOf(base.headExtra);
      if(at >= 0){ out = out.slice(0, at) + m.headExtra + out.slice(at + base.headExtra.length); rep.push('extras del head'); }
    }
    if(ch('tail') && base.tail){
      const at = out.indexOf(base.tail);
      if(at >= 0){ out = out.slice(0, at) + m.tail + out.slice(at + base.tail.length); rep.push('scripts finales'); }
    }

    /* cuerpo del artículo: se conserva la sangría del \x3C/article> original */
    if(ch('body')){
      const open  = out.search(new RegExp('\x3Carticle' + ATTRS + '>', 'i'));
      const close = out.lastIndexOf('\x3C/article>');
      if(open >= 0 && close > open){
        const openTag = out.slice(open).match(new RegExp('^\x3Carticle' + ATTRS + '>', 'i'))[0];
        const inner   = out.slice(open + openTag.length, close);
        const indent  = (inner.match(/\n([ \t]*)$/) || ['',''])[1];
        out = out.slice(0, open + openTag.length) + '\n' + (m.body || '') + '\n' + indent + out.slice(close);
        rep.push('cuerpo');
      }
    }

    m._changed = rep;
    return out;
  },

  /* Devuelve el HTML final según el modo elegido */
  render(m, mode, original, base){
    if(mode === 'rebuild' || !original) return this.build(m);
    return this.apply(original, m, base);
  }
};

/** Reemplaza el atributo content de un <meta> localizado por name/property. */
function setMetaContent(raw, attr, key, value){
  const re = new RegExp('<meta' + ATTRS + attr + '\\s*=\\s*["\']' + reEsc(key) + '["\']' + ATTRS + '>', 'i');
  const m = raw.match(re);
  if(!m) return { out: raw, found:false, changed:false };
  const tag = m[0];
  let next;
  if(/content\s*=\s*"/i.test(tag))      next = tag.replace(/content\s*=\s*"[^"]*"/i, 'content="' + escAttr(value) + '"');
  else if(/content\s*=\s*'/i.test(tag)) next = tag.replace(/content\s*=\s*'[^']*'/i, 'content="' + escAttr(value) + '"');
  else                                  next = tag.replace(/\s*(\/?)>$/, ' content="' + escAttr(value) + '"$1>');
  return { out: raw.slice(0, m.index) + next + raw.slice(m.index + tag.length), found:true, changed: next !== tag };
}

<script>
/* ==============================================================
   7. Validación (SSI, SEO, estructura)
   ============================================================== */

function validate(html, m){
  const out = [];
  const err  = (t, d) => out.push({level:'error', title:t, detail:d});
  const warn = (t, d) => out.push({level:'warn',  title:t, detail:d});
  const ok   = (t, d) => out.push({level:'ok',    title:t, detail:d});

  /* --- estructura base --- */
  if(!/^\s*<!DOCTYPE html>/i.test(html)) err('Falta el DOCTYPE', 'El documento debe empezar con <code>&lt;!DOCTYPE html&gt;</code>.');
  if(!/<html[^>]*lang\s*=\s*["']es["']/i.test(html)) err('Falta lang="es"', 'La etiqueta <code>&lt;html&gt;</code> debe declarar <code>lang="es"</code>.');
  if(!/<\/head>/i.test(html)) err('Falta &lt;/head&gt;', 'El documento no cierra el head.');
  if(!/<\/html>/i.test(html)) err('Falta &lt;/html&gt;', 'El documento no cierra el html.');
  if(/<body[\s>]/i.test(html)) warn('Se agregó &lt;body&gt;', 'Los artículos del sitio no abren <code>&lt;body&gt;</code> (lo abre el navegador). Mantener la convención evita diferencias con el resto del blog.');

  /* --- SSI: lo más importante --- */
  const ssi = Article.ssiList(html).map(x => x.path);
  const required = [
    ['/sticky-mobile-cta.html', 'head'],
    ['/right-banner-cta.html',  'head'],
    ['/navbar.html',            'después de </head>'],
    ['/footer.html',            'después de </article>']
  ];
  const missing = required.filter(([p]) => ssi.indexOf(p) < 0);
  if(missing.length){
    err('Faltan directivas SSI (' + missing.length + ')',
      'El sitio arma navbar, footer y CTAs por includes de servidor. Falta: ' +
      missing.map(([p,w]) => '<code>&lt;!--#include file="' + p + '" --&gt;</code> (' + w + ')').join(', '));
  }else{
    ok('Directivas SSI intactas', ssi.length + ' includes presentes: ' + ssi.map(p => '<code>' + esc(p) + '</code>').join(' '));
  }
  if(ssi.indexOf('/content-cta.html') < 0)
    warn('Sin CTA en el cuerpo', 'Los artículos suelen llevar <code>&lt;!--#include file="/content-cta.html" --&gt;</code> antes de la conclusión.');

  const badSsi = html.match(/\x3C!--\s*#\s*include(?![^>]*file\s*=\s*"\/[^"]+\.html"\s*-->)[\s\S]{0,80}?-->/g);
  if(badSsi) err('Directiva SSI mal formada', 'Formato correcto: <code>&lt;!--#include file="/archivo.html" --&gt;</code>. Encontrado: <code>' + esc(badSsi[0].slice(0,90)) + '</code>');

  /* --- SEO --- */
  const title = m.title || '';
  if(!title) err('Sin título', 'El <code>&lt;title&gt;</code> está vacío.');
  else if(title.length > 65) warn('Título largo (' + title.length + ')', 'Google suele cortar sobre 60–65 caracteres.');
  else ok('Título (' + title.length + ' caracteres)', esc(title));

  const d = m.description || '';
  if(!d) err('Sin meta description', 'Es obligatoria para buscadores y para las tarjetas sociales.');
  else if(d.length < 50)  warn('Descripción corta (' + d.length + ')', 'Apunta a 120–160 caracteres.');
  else if(d.length > 165) warn('Descripción larga (' + d.length + ')', 'Sobre 160 caracteres se corta.');
  else ok('Meta description (' + d.length + ' caracteres)', esc(d));

  if(!m.canonical) err('Sin canonical', 'Falta <code>&lt;link rel="canonical"&gt;</code>.');
  else if(!/^https:\/\//.test(m.canonical)) err('Canonical inválida', 'Debe ser una URL absoluta https.');
  else ok('Canonical', '<code>' + esc(m.canonical) + '</code>');

  ['og:title','og:description','og:image','og:url'].forEach(p => {
    if(!new RegExp('property\\s*=\\s*["\']' + reEsc(p) + '["\']','i').test(html)) err('Falta ' + p, 'Open Graph incompleto: las previsualizaciones al compartir salen mal.');
  });
  if(m.image && !/^https:\/\//.test(m.image)) err('Imagen de portada inválida', 'Debe ser una URL absoluta del CDN.');
  if(m.image && m.slug && m.image.indexOf(m.slug) < 0)
    warn('Portada y slug no coinciden', 'La convención del endpoint es <code>' + esc(SITE.cdnPattern.replace('{slug}', m.slug)) + '</code>.');

  /* --- cuerpo --- */
  const body = m.body || '';
  const h1s = body.match(/<h1[\s>]/gi) || [];
  if(h1s.length === 0)      err('Sin H1', 'El artículo debe tener un <code>&lt;h1&gt;</code> con el título.');
  else if(h1s.length > 1)   err('Hay ' + h1s.length + ' H1', 'Debe existir exactamente uno.');
  else ok('Un solo H1', 'Correcto.');

  const h1txt = (body.match(/<h1[^>]*>([\s\S]*?)<\/h1>/i) || [,''])[1];
  if(h1txt && title && stripTags(h1txt).toLowerCase() !== title.toLowerCase())
    warn('H1 distinto del &lt;title&gt;', 'H1: “' + esc(stripTags(h1txt)) + '”. No es un error, pero conviene que coincidan salvo que el title esté acortado a propósito.');

  const imgs = body.match(/<img[^>]*>/gi) || [];
  const noAlt = imgs.filter(t => !/alt\s*=\s*["'][^"']+["']/i.test(t));
  if(noAlt.length) warn(noAlt.length + ' imagen(es) sin alt', 'El <code>alt</code> descriptivo es requisito de accesibilidad y de SEO.');
  else if(imgs.length) ok(imgs.length + ' imagen(es) con alt', 'Correcto.');

  const badAnchor = body.match(/<a[^>]*>\s*<\/a>/gi);
  if(badAnchor) warn('Enlace vacío', 'Hay ' + badAnchor.length + ' <code>&lt;a&gt;&lt;/a&gt;</code> sin texto: probablemente una etiqueta mal cerrada.');
  const orphanClose = (body.match(/<\/a>/gi) || []).length - (body.match(/<a[\s>]/gi) || []).length;
  if(orphanClose > 0) err('Etiquetas &lt;/a&gt; de más', 'Hay ' + orphanClose + ' cierre(s) sin apertura: rompe el HTML del artículo.');

  /* balance grueso de etiquetas del cuerpo */
  ['p','h2','h3','ul','ol','li','figure','article','div','section','strong','em','table'].forEach(t => {
    const o = (body.match(new RegExp('<' + t + '[\\s>]', 'gi')) || []).length;
    const c = (body.match(new RegExp('</' + t + '>', 'gi')) || []).length;
    if(o !== c) warn('Etiquetas &lt;' + t + '&gt; desbalanceadas', o + ' aperturas y ' + c + ' cierres.');
  });

  /* --- slug y JSON-LD --- */
  if(!m.slug) err('Sin slug', 'Define el nombre de archivo y la URL.');
  else if(!validSlug(m.slug)) err('Slug inválido', 'Solo minúsculas, números y guiones simples. Sin tildes, sin ñ, sin guion al inicio o final.');
  else ok('Slug', '<code>' + esc(m.slug) + '.html</code>');

  const ldBlocks = html.match(new RegExp('\x3Cscript' + ATTRS + 'application/ld\\+json' + ATTRS + '>([\\s\\S]*?)<\\/script>', 'gi')) || [];
  let ldBad = 0;
  ldBlocks.forEach(b => { try{ JSON.parse(b.replace(/^[\s\S]*?>/, '').replace(/\x3C\/script>$/,'')); }catch(e){ ldBad++; } });
  if(ldBad) err(ldBad + ' bloque(s) JSON-LD inválidos', 'El JSON estructurado no parsea: Google lo ignora.');
  else if(ldBlocks.length) ok(ldBlocks.length + ' bloque(s) JSON-LD válidos', 'Datos estructurados correctos.');

  const wc = wordCount(body);
  if(wc < 300) warn('Artículo corto (' + wc + ' palabras)', 'Bajo 300 palabras rinde mal en buscadores.');
  else ok(wc + ' palabras · ' + readMinutes(body) + ' min de lectura', '');

  return out;
}
function countErrors(v){ return v.filter(x => x.level === 'error').length; }
function countWarns(v){ return v.filter(x => x.level === 'warn').length; }

/* ==============================================================
   8. Diff por líneas (para revisar antes de crear el PR)
   ============================================================== */

function lineDiff(a, b){
  const A = String(a || '').split('\n'), B = String(b || '').split('\n');
  const n = A.length, mm = B.length;
  if(n * mm > 4000000){
    return [{t:'c', v:'(archivos muy grandes para diff detallado — ' + n + ' → ' + mm + ' líneas)'}];
  }
  const dp = [];
  for(let i = 0; i <= n; i++) dp.push(new Uint32Array(mm + 1));
  for(let i = n - 1; i >= 0; i--)
    for(let j = mm - 1; j >= 0; j--)
      dp[i][j] = A[i] === B[j] ? dp[i+1][j+1] + 1 : Math.max(dp[i+1][j], dp[i][j+1]);
  const out = [];
  let i = 0, j = 0;
  while(i < n && j < mm){
    if(A[i] === B[j]){ out.push({t:'=', v:A[i]}); i++; j++; }
    else if(dp[i+1][j] >= dp[i][j+1]){ out.push({t:'d', v:A[i]}); i++; }
    else { out.push({t:'a', v:B[j]}); j++; }
  }
  while(i < n){ out.push({t:'d', v:A[i++]}); }
  while(j < mm){ out.push({t:'a', v:B[j++]}); }
  return out;
}
function renderDiff(a, b){
  const d = lineDiff(a, b);
  const changed = d.filter(x => x.t !== '=').length;
  if(!changed) return '<div class="muted" style="font-size:12.5px">Sin cambios respecto del archivo actual.</div>';
  const parts = [];
  let ctx = 0;
  for(let i = 0; i < d.length; i++){
    const x = d[i];
    if(x.t === '='){
      const near = d.slice(Math.max(0,i-3), i+4).some(y => y.t !== '=');
      if(near){ parts.push('<span class="c">  ' + esc(x.v) + '</span>'); ctx = 0; }
      else if(ctx === 0){ parts.push('<span class="c" style="opacity:.45">  ⋮</span>'); ctx = 1; }
    }
    else if(x.t === 'a') parts.push('<span class="a">+ ' + esc(x.v) + '</span>');
    else parts.push('<span class="d">- ' + esc(x.v) + '</span>');
  }
  const adds = d.filter(x => x.t === 'a').length, dels = d.filter(x => x.t === 'd').length;
  return '<div class="inline" style="margin-bottom:7px"><span class="chip ok">+' + adds + '</span><span class="chip err">−' + dels + '</span>' +
         '<span class="muted" style="font-size:11.5px">líneas</span></div>' +
         '<div class="diffbox">' + parts.join('\n') + '</div>';
}

<script>
/* ==============================================================
   9. Índice del blog (blog.html): tarjetas por año
   ============================================================== */

const MESES = ['Ene','Feb','Mar','Abr','May','Jun','Jul','Ago','Sep','Oct','Nov','Dic'];
function cardDate(iso){
  const d = new Date(iso || Date.now());
  if(isNaN(d)) return '';
  return String(d.getUTCDate()).padStart(2,'0') + ' ' + MESES[d.getUTCMonth()] + ' ' + d.getUTCFullYear();
}
function yearOf(iso){
  const d = new Date(iso || Date.now());
  return isNaN(d) ? new Date().getUTCFullYear() : d.getUTCFullYear();
}

const IndexPage = {
  cardHtml(c){
    return '      <article class="card">\n' +
           '        <a class="stretched" href="/' + SITE.articlesDir + '/' + c.slug + '/" aria-label="' + escAttr(c.title) + '"></a>\n' +
           '        <div class="thumb">\n' +
           '          <img loading="lazy" src="' + escAttr(c.image) + '" alt="' + escAttr(c.alt || c.title) + '" />\n' +
           '        </div>\n' +
           '        <div class="content">\n' +
           '          <h3 class="title">' + escText(c.title) + '</h3>\n' +
           '          <p class="meta"><span>' + escText(c.date) + '</span> <span class="dot"></span> <span>' + escText(c.tag || '') + '</span></p>\n' +
           '        </div>\n' +
           '      </article>';
  },

  /** Devuelve las tarjetas existentes con su año. */
  list(html){
    const out = [];
    const secRe = /<section[^>]*data-section\s*=\s*"(\d{4})"[^>]*>([\s\S]*?)<\/section>/gi;
    let s;
    while((s = secRe.exec(html)) !== null){
      const year = s[1], inner = s[2];
      const cardRe = /<article class="card">([\s\S]*?)<\/article>/gi;
      let c;
      while((c = cardRe.exec(inner)) !== null){
        const raw = c[0];
        const href  = (raw.match(/href\s*=\s*"([^"]*)"/i) || [,''])[1];
        const slug  = (href.match(/\/articulos\/([^/"#?]+)/) || [,''])[1];
        const title = stripTags((raw.match(/<h3 class="title">([\s\S]*?)<\/h3>/i) || [,''])[1]);
        const image = (raw.match(/<img[^>]*src\s*=\s*"([^"]*)"/i) || [,''])[1];
        const date  = stripTags((raw.match(/<p class="meta">\s*<span>([\s\S]*?)<\/span>/i) || [,''])[1]);
        const tag   = stripTags((raw.match(/<span class="dot"><\/span>\s*<span>([\s\S]*?)<\/span>/i) || [,''])[1]);
        out.push({ year, slug, title, image, date, tag, raw });
      }
    }
    return out;
  },

  has(html, slug){ return this.list(html).some(c => c.slug === slug); },

  /** Inserta o reemplaza la tarjeta del slug indicado. */
  upsert(html, card){
    const cardStr = this.cardHtml(card);

    /* 1. ya existe → se reemplaza en su sitio */
    const cardRe = /<article class="card">[\s\S]*?<\/article>/gi;
    let m, found = null;
    while((m = cardRe.exec(html)) !== null){
      if(new RegExp('href\\s*=\\s*"/' + reEsc(SITE.articlesDir) + '/' + reEsc(card.slug) + '/?"').test(m[0])){ found = m; break; }
    }
    if(found){
      const before = html.slice(0, found.index).match(/[ \t]*$/)[0];
      return { html: html.slice(0, found.index - before.length) + cardStr + html.slice(found.index + found[0].length), action:'actualizada' };
    }

    /* 2. existe la sección del año → se inserta arriba del grid */
    const year = String(card.year);
    const secRe = new RegExp('(<section[^>]*data-section\\s*=\\s*"' + year + '"[^>]*>[\\s\\S]*?<div class="grid">)', 'i');
    if(secRe.test(html)) return { html: html.replace(secRe, '$1\n\n' + cardStr), action:'agregada' };

    /* 3. no existe el año → se crea la sección y su botón de filtro */
    const section = '\n  \x3C!-- ===== ' + year + ' ===== -->\n' +
      '  <section class="year-section" data-section="' + year + '" aria-label="Artículos ' + year + '">\n' +
      '    <div class="grid">\n\n' + cardStr + '\n\n    </div>\n  </section>\n';
    let out = html;
    const firstSec = out.search(/<section[^>]*class="year-section/i);
    if(firstSec >= 0){
      const lineStart = out.lastIndexOf('\n', out.lastIndexOf('\x3C!-- =====', firstSec) >= 0 ? out.lastIndexOf('\x3C!-- =====', firstSec) : firstSec);
      out = out.slice(0, lineStart) + section + out.slice(lineStart);
    }else{
      out = out.replace(/(<div class="blog-wrap">)/i, '$1\n' + section);
    }
    const btn = '    <button type="button" data-year="' + year + '" role="tab" aria-selected="false">' + year + '</button>\n';
    out = out.replace(/(<div class="year-filter"[^>]*>\s*\n\s*<span class="label">[^<]*<\/span>\s*\n)/i, '$1' + btn);
    return { html: out, action:'agregada (nueva sección ' + year + ')' };
  },

  remove(html, slug){
    const cardRe = /[ \t]*<article class="card">[\s\S]*?<\/article>\n?/gi;
    let m, found = null;
    while((m = cardRe.exec(html)) !== null){
      if(new RegExp('href\\s*=\\s*"/' + reEsc(SITE.articlesDir) + '/' + reEsc(slug) + '/?"').test(m[0])){ found = m; break; }
    }
    if(!found) return { html, action:'no estaba en el índice' };
    return { html: html.slice(0, found.index) + html.slice(found.index + found[0].length), action:'eliminada' };
  }
};

/* ==============================================================
   10. Cliente de la API del droplet
   ============================================================== */

class ApiError extends Error{
  constructor(msg, status, body){ super(msg); this.status = status; this.body = body; }
}

const Api = {
  base(){ return String(S.apiBase || '').replace(/\/+$/,''); },
  ready(){ return !!(this.base() && S.token); },

  async req(path, opts){
    opts = opts || {};
    if(!this.base()) throw new ApiError('No hay URL de API configurada. Abre Ajustes.', 0);
    const url = this.base() + path;
    const headers = Object.assign({ 'Accept':'application/json' }, opts.headers || {});
    if(S.token) headers['Authorization'] = 'Bearer ' + S.token;
    if(opts.body != null) headers['Content-Type'] = 'application/json';
    const ctl = new AbortController();
    const to = setTimeout(()=>ctl.abort(), opts.timeout || 45000);
    let res;
    try{
      res = await fetch(url, {
        method: opts.method || 'GET',
        headers,
        body: opts.body != null ? JSON.stringify(opts.body) : undefined,
        signal: ctl.signal,
        mode: 'cors',
        cache: 'no-store'
      });
    }catch(e){
      clearTimeout(to);
      if(e.name === 'AbortError') throw new ApiError('Tiempo de espera agotado (' + Math.round((opts.timeout||45000)/1000) + 's).', 0);
      throw new ApiError('No se pudo conectar con ' + url + '. Revisa la URL, que el servicio esté arriba y que CORS permita el origen local.', 0);
    }
    clearTimeout(to);
    const txt = await res.text();
    let body = null;
    try{ body = txt ? JSON.parse(txt) : null; }catch(e){ body = txt; }
    if(!res.ok){
      const msg = (body && (body.error || body.message)) || ('HTTP ' + res.status);
      throw new ApiError(msg, res.status, body);
    }
    return body;
  },

  health()             { return this.req('/api/cms/health', {timeout:15000}); },
  articles()           { return this.req('/api/cms/articles'); },
  article(slug)        { return this.req('/api/cms/articles/' + encodeURIComponent(slug)); },
  file(path)           { return this.req('/api/cms/file?path=' + encodeURIComponent(path)); },
  includes()           { return this.req('/api/cms/includes'); },
  prs()                { return this.req('/api/cms/prs'); },
  pr(payload)          { return this.req('/api/cms/pr', {method:'POST', body:payload, timeout:90000}); },
  publish(payload)     { return this.req('/api/cms/publish', {method:'POST', body:payload, timeout:150000}); }
};

/* ==============================================================
   11. Carpeta local (File System Access API + respaldo por <input>)
   ============================================================== */

const LocalFs = {
  root: null,
  name: '',
  memory: null,   /* respaldo de solo lectura: { 'articulos/x.html': 'contenido' } */
  supported: typeof window.showDirectoryPicker === 'function',

  async connect(){
    if(!this.supported) throw new Error('unsupported');
    const h = await window.showDirectoryPicker({ id:'chtr-blog', mode:'readwrite' });
    const perm = await h.requestPermission({ mode:'readwrite' });
    if(perm !== 'granted') throw new Error('Permiso denegado sobre la carpeta.');
    this.root = h; this.name = h.name; this.memory = null;
    await this.saveHandle(h);
    return h;
  },

  async saveHandle(h){
    try{
      const db = await this.idb(); if(!db) return;
      const tx = db.transaction('h','readwrite'); tx.objectStore('h').put(h,'root');
    }catch(e){ /* IndexedDB no disponible: la carpeta se reconecta a mano */ }
  },
  async restore(){
    try{
      const db = await this.idb(); if(!db) return false;
      const h = await new Promise((res, rej) => {
        const r = db.transaction('h','readonly').objectStore('h').get('root');
        r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
      });
      if(!h) return false;
      const p = await h.queryPermission({mode:'readwrite'});
      if(p !== 'granted') { this.pending = h; return false; }
      this.root = h; this.name = h.name;
      return true;
    }catch(e){ return false; }
  },
  idb(){
    return new Promise(res => {
      try{
        const r = indexedDB.open('chtr_cms', 1);
        r.onupgradeneeded = () => { if(!r.result.objectStoreNames.contains('h')) r.result.createObjectStore('h'); };
        r.onsuccess = () => res(r.result);
        r.onerror = () => res(null);
      }catch(e){ res(null); }
    });
  },

  connected(){ return !!this.root || !!this.memory; },

  async dirOf(path, create){
    const parts = path.split('/').filter(Boolean);
    parts.pop();
    let d = this.root;
    for(const p of parts) d = await d.getDirectoryHandle(p, {create: !!create});
    return d;
  },
  fileName(path){ return path.split('/').filter(Boolean).pop(); },

  async read(path){
    if(this.root){
      const d = await this.dirOf(path);
      const fh = await d.getFileHandle(this.fileName(path));
      return (await fh.getFile()).text();
    }
    if(this.memory && this.memory[path] != null) return this.memory[path];
    throw new Error('No encontrado: ' + path);
  },

  async write(path, content){
    if(!this.root) throw new Error('La carpeta local es de solo lectura en este modo. Conéctala con “Carpeta local” en un navegador Chromium.');
    const d = await this.dirOf(path, true);
    const fh = await d.getFileHandle(this.fileName(path), {create:true});
    const w = await fh.createWritable();
    await w.write(new Blob([content], {type:'text/html;charset=utf-8'}));
    await w.close();
  },

  async remove(path){
    if(!this.root) throw new Error('La carpeta local es de solo lectura en este modo.');
    const d = await this.dirOf(path);
    await d.removeEntry(this.fileName(path));
  },

  async listArticles(){
    const out = [];
    if(this.root){
      let dir;
      try{ dir = await this.root.getDirectoryHandle(SITE.articlesDir); }
      catch(e){ throw new Error('La carpeta elegida no contiene "' + SITE.articlesDir + '/". Selecciona la raíz del repositorio del blog.'); }
      for await (const [name, h] of dir.entries()){
        if(h.kind !== 'file' || !/\.html$/i.test(name)) continue;
        const f = await h.getFile();
        out.push({ name, path: SITE.articlesDir + '/' + name, size: f.size, mtime: f.lastModified, text: await f.text() });
      }
      return out;
    }
    if(this.memory){
      Object.keys(this.memory).forEach(p => {
        if(p.indexOf(SITE.articlesDir + '/') !== 0 || !/\.html$/i.test(p)) return;
        out.push({ name: p.split('/').pop(), path: p, size: this.memory[p].length, mtime: null, text: this.memory[p] });
      });
      return out;
    }
    throw new Error('No hay carpeta local conectada.');
  },

  async loadFromInput(files){
    const map = {};
    for(const f of files){
      const rel = (f.webkitRelativePath || f.name).split('/').slice(1).join('/');
      if(!/\.html$/i.test(rel)) continue;
      if(rel.indexOf(SITE.articlesDir + '/') === 0 || rel.indexOf('/') < 0) map[rel] = await f.text();
    }
    if(!Object.keys(map).some(k => k.indexOf(SITE.articlesDir + '/') === 0))
      throw new Error('La carpeta elegida no contiene "' + SITE.articlesDir + '/". Selecciona la raíz del repositorio del blog.');
    this.memory = map; this.root = null;
    this.name = files[0] ? (files[0].webkitRelativePath || '').split('/')[0] : 'carpeta';
    return map;
  },

  disconnect(){ this.root = null; this.memory = null; this.name = ''; }
};
</script>
<script>
/* ==============================================================
   12. Estado de la aplicación
   ============================================================== */

const App = {
  items   : {},     /* slug -> registro */
  drafts  : Store.get('drafts', {}),
  prs     : [],
  includes: {},
  indexHtml: null,
  indexSource: null,
  view    : 'library',
  editing : null,
  filter  : { q:'', src:'all', sort:'date' },
  serverInfo: null,
  loading : false
};

function saveDrafts(){ Store.set('drafts', App.drafts); }

function metaFromHtml(html, slug){
  const m = Article.parse(html);
  m.slug = slug;
  return m;
}

function record(slug){
  if(!App.items[slug]) App.items[slug] = { slug, local:null, remote:null, meta:null, isTemplate: slug === 'base-blog' };
  return App.items[slug];
}

async function loadLocal(silent){
  if(!LocalFs.connected()) return 0;
  const id = Log.start('Leer carpeta local', LocalFs.name + '/' + SITE.articlesDir);
  try{
    const files = await LocalFs.listArticles();
    files.forEach(f => {
      const slug = f.name.replace(/\.html$/i,'');
      const r = record(slug);
      r.local = { path:f.path, size:f.size, mtime:f.mtime, html:f.text };
      r.meta = metaFromHtml(f.text, slug);
    });
    /* índice del blog */
    try{ App.indexHtml = await LocalFs.read(SITE.indexFile); App.indexSource = 'local'; }catch(e){ /* sin índice local: se pedirá a la API */ }
    /* includes SSI para la vista previa real */
    for(const p of SITE.includeFiles){
      try{ App.includes[p] = await LocalFs.read(p.replace(/^\//,'')); }catch(e){ /* include ausente: la vista previa lo marca */ }
    }
    Log.finish(id, 'ok', { archivos: files.length, includes: Object.keys(App.includes).length });
    if(!silent) toast(files.length + ' artículo(s) leídos de la carpeta local', 'ok');
    return files.length;
  }catch(e){
    Log.finish(id, 'error', String(e.message || e));
    if(!silent) toast(e.message || String(e), 'err', 6000);
    return 0;
  }
}

async function loadRemote(silent){
  if(!Api.ready()) return 0;
  const id = Log.start('Listar artículos (API)', Api.base());
  try{
    const res = await Api.articles();
    const list = res.articles || res || [];
    list.forEach(a => {
      const r = record(a.slug);
      r.remote = a;
      if(!r.meta && a.title){
        r.meta = Object.assign(Article.blank(), {
          slug:a.slug, title:a.title, description:a.description || '', image:a.image || '',
          canonical:a.canonical || '', datePublished:a.datePublished || '', dateModified:a.dateModified || ''
        });
      }
    });
    Log.finish(id, 'ok', { articulos: list.length, fuente: res.source, rama: res.branch });
    if(!silent) toast(list.length + ' artículo(s) desde la API', 'ok');
    return list.length;
  }catch(e){
    Log.finish(id, 'error', { status:e.status, error:String(e.message || e) });
    if(!silent) toast('API: ' + (e.message || e), 'err', 6500);
    return 0;
  }
}

async function loadPrs(silent){
  if(!Api.ready()) return;
  try{
    const res = await Api.prs();
    App.prs = res.pulls || res || [];
    $('#cntPrs').textContent = App.prs.length;
  }catch(e){ if(!silent) console.warn('PRs:', e.message); }
}

async function reloadAll(silent){
  App.loading = true; render();
  await Promise.all([ loadLocal(silent), loadRemote(silent) ]);
  await loadPrs(true);
  App.loading = false;
  updateCounts();
  render();
}

function updateCounts(){
  $('#cntAll').textContent    = Object.keys(App.items).length;
  $('#cntDrafts').textContent = Object.keys(App.drafts).length;
  $('#cntPrs').textContent    = App.prs.length;
}

/** Obtiene el HTML completo del artículo, prefiriendo la carpeta local. */
async function getHtml(slug, prefer){
  const r = App.items[slug];
  if(!r) throw new Error('Artículo desconocido: ' + slug);
  if(prefer !== 'remote' && r.local) return r.local.html;
  if(r.remote){
    if(r.remote.html) return r.remote.html;
    const res = await Api.article(slug);
    r.remote.html = res.html; r.remote.sha = res.sha || r.remote.sha;
    return res.html;
  }
  if(r.local) return r.local.html;
  throw new Error('Sin contenido para ' + slug);
}

/* ==============================================================
   13. Render principal
   ============================================================== */

function render(){
  const v = App.view;
  updateCounts();
  $$('.side button[data-nav]').forEach(b => b.classList.toggle('active', b.dataset.nav === v));
  if(v === 'library') return renderLibrary();
  if(v === 'drafts')  return renderDrafts();
  if(v === 'prs')     return renderPrs();
  if(v === 'index')   return renderIndex();
  if(v === 'help')    return renderHelp();
  if(v === 'editor')  return renderEditor();
}

function srcChips(r){
  const out = [];
  if(r.local)  out.push('<span class="chip info" title="Presente en la carpeta local"><span class="dot"></span>Local</span>');
  if(r.remote) out.push('<span class="chip brand" title="Presente en el repositorio remoto"><span class="dot"></span>Repo</span>');
  if(r.local && !r.remote) out.push('<span class="chip warn">Sin publicar</span>');
  if(r.isTemplate) out.push('<span class="chip mute">Plantilla</span>');
  const pr = App.prs.find(p => (p.slug === r.slug));
  if(pr) out.push('<span class="chip ok">PR #' + pr.number + '</span>');
  return out.join(' ');
}

function filtered(){
  const q = App.filter.q.toLowerCase().trim();
  let list = Object.values(App.items);
  if(App.filter.src === 'local')  list = list.filter(r => r.local);
  if(App.filter.src === 'remote') list = list.filter(r => r.remote);
  if(App.filter.src === 'unpub')  list = list.filter(r => r.local && !r.remote);
  if(App.filter.src === 'article')list = list.filter(r => !r.isTemplate);
  if(q) list = list.filter(r =>
    r.slug.toLowerCase().indexOf(q) >= 0 ||
    ((r.meta && r.meta.title) || '').toLowerCase().indexOf(q) >= 0 ||
    ((r.meta && r.meta.description) || '').toLowerCase().indexOf(q) >= 0);
  const key = App.filter.sort;
  list.sort((a,b) => {
    if(key === 'title') return ((a.meta&&a.meta.title)||a.slug).localeCompare((b.meta&&b.meta.title)||b.slug,'es');
    if(key === 'slug')  return a.slug.localeCompare(b.slug,'es');
    const da = (a.meta && (a.meta.datePublished || a.meta.dateModified)) || '';
    const db = (b.meta && (b.meta.datePublished || b.meta.dateModified)) || '';
    return String(db).localeCompare(String(da));
  });
  return list;
}

function renderLibrary(){
  const list = filtered();
  const total = Object.keys(App.items).length;
  const head =
    '<div class="page-head">' +
      '<div><h1>Biblioteca</h1><p>' + total + ' artículo(s) · carpeta: ' +
      (LocalFs.connected() ? '<b>' + esc(LocalFs.name) + '</b>' : '<span class="muted">sin conectar</span>') +
      ' · API: ' + (App.serverInfo ? '<b>' + esc(App.serverInfo.repo || '') + '</b> (' + esc(App.serverInfo.branch || S.baseBranch) + ')' : '<span class="muted">sin conectar</span>') + '</p></div>' +
      '<div class="acts">' +
        '<button class="btn" data-act="reload"><ion-icon name="refresh-outline"></ion-icon> Recargar</button>' +
