<!-- Breadcrumbs SSI: migas de pan + JSON-LD BreadcrumbList
     =====================================================================
     CUIDADO al editar este encabezado. Un comentario HTML termina en su
     primera secuencia de cierre, así que aquí NO se puede escribir ninguna
     directiva SSI de ejemplo ni ninguna secuencia de cierre suelta: lo que
     venga después dejaría de ser comentario y el servidor lo ejecutaría.
     Un include de este mismo archivo, por ejemplo, se llamaría a sí mismo
     en bucle. Por eso los ejemplos de abajo van en prosa, sin sintaxis.
     =====================================================================

     Dónde va: dentro del elemento article, justo antes del titular h1.

     Cómo se usa: el artículo declara primero tres variables con la
     directiva SSI set, y después incluye este archivo con la directiva SSI
     include apuntando a /breadcrumbs.html.

     Las tres variables, con su valor según la pista:

       bc_hub_name   Transportistas      |  Contratar transporte
       bc_hub_url    /transportistas/    |  /contratar-transporte/
       bc_title      título corto del artículo

     La primera columna es la pista de quien tiene camiones y busca carga;
     la segunda, la de quien necesita mover carga. Copia el bloque ya
     escrito desde articulos/base-blog.html o desde
     contratar-transporte/base-blog.html en vez de escribirlo a mano.

     bc_title NO debe llevar comillas dobles: se imprime tal cual dentro
     del JSON-LD. Acentos y ñ sí, comillas no.
-->

<style>
.chtr-breadcrumbs{
  font-family:'Quicksand', system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
  font-size:.9rem;
  line-height:1.4;
  color:#666;
  padding-top:40px;   /* despeja el navbar fijo */
  margin:0 0 4px;
}
.chtr-breadcrumbs ol{
  list-style:none;
  display:flex;
  flex-wrap:wrap;
  align-items:center;
  gap:6px;
  margin:0;
  padding:0;
}
.chtr-breadcrumbs li{
  display:flex;
  align-items:center;
  gap:6px;
  min-width:0;
}
.chtr-breadcrumbs li + li::before{
  content:'›';
  color:#bbb;
  font-size:1.05rem;
  line-height:1;
}
.chtr-breadcrumbs a{
  color:#666;
  text-decoration:none;
  border-bottom:1px solid transparent;
  transition:color .2s ease, border-color .2s ease;
}
.chtr-breadcrumbs a:hover{
  color:#d50032;
  border-bottom-color:#d50032;
}
.chtr-breadcrumbs [aria-current="page"]{
  color:#333;
  font-weight:600;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
  max-width:100%;
}
/* El h1 ya no necesita su margen superior completo: las migas ocupan ese hueco. */
.chtr-breadcrumbs + h1{ margin-top:56px; }

@media (max-width:600px){
  .chtr-breadcrumbs{ font-size:.82rem; }
  .chtr-breadcrumbs + h1{ margin-top:28px; }
}
</style>

<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "BreadcrumbList",
  "itemListElement": [
    {
      "@type": "ListItem",
      "position": 1,
      "name": "Inicio",
      "item": "https://blog.chiletransportistas.com/"
    },
    {
      "@type": "ListItem",
      "position": 2,
      "name": "<!--#echo var="bc_hub_name" encoding="none" -->",
      "item": "https://blog.chiletransportistas.com<!--#echo var="bc_hub_url" encoding="none" -->"
    },
    {
      "@type": "ListItem",
      "position": 3,
      "name": "<!--#echo var="bc_title" encoding="none" -->"
    }
  ]
}
</script>

<nav class="chtr-breadcrumbs" aria-label="Ruta de navegación">
  <ol>
    <li><a href="https://blog.chiletransportistas.com/">Inicio</a></li>
    <li><a href="<!--#echo var="bc_hub_url" encoding="none" -->"><!--#echo var="bc_hub_name" --></a></li>
    <li aria-current="page"><!--#echo var="bc_title" --></li>
  </ol>
</nav>
